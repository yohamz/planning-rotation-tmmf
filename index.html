<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PLANNING CH2-2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#F7F8F9; --line:#DADDE1; --line-2:#BEC3C9;
  --ink:#1E2125; --ink-2:#4A4F56; --muted:#7B8189;
  --red:#EB0A1E; --red-ink:#FFFFFF; --red-soft:#FDE8EA;
  --mark:#5B6067; --tl:#ECEEF1;
  --vert:#2E9A58; --orange:#EE8A00; --rouge:#D3203A;
  --f-ui:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131517; --surface:#1C1F22; --surface-2:#222629; --line:#32373C; --line-2:#474D54;
    --ink:#ECEEF0; --ink-2:#B5BBC1; --muted:#868D94;
    --red:#FF3347; --red-ink:#FFFFFF; --red-soft:#3A161A;
    --mark:#A9AEB4; --tl:#262A2E;
    --vert:#4CC07C; --orange:#FFA630; --rouge:#FF5A6E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131517; --surface:#1C1F22; --surface-2:#222629; --line:#32373C; --line-2:#474D54;
  --ink:#ECEEF0; --ink-2:#B5BBC1; --muted:#868D94;
  --red:#FF3347; --red-ink:#FFFFFF; --red-soft:#3A161A;
  --mark:#A9AEB4; --tl:#262A2E;
  --vert:#4CC07C; --orange:#FFA630; --rouge:#FF5A6E;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.35}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
h1,h2{font-family:var(--f-cond);font-weight:700;margin:0;letter-spacing:.01em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-top:4px solid var(--red);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-cond);font-weight:700;font-size:22px;white-space:nowrap}
.brand i{width:14px;height:14px;background:var(--red);border-radius:3px;display:block}
.brand span{color:var(--muted);font-weight:600}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{border:0;background:none;padding:10px 16px;border-radius:9px;font-weight:600;color:var(--ink-2);min-height:46px;font-size:16px}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--surface)}
main{max-width:1280px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-red{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn-red:hover{background:var(--red);filter:brightness(1.07)}
.btn-sm{min-height:38px;padding:6px 12px;font-size:15px}
.icon{width:46px;height:46px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:24px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
input[type=date],input[type=text],select{min-height:46px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:6px 10px}
input[type=text]{width:100%}

.bar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.bar .grow{flex:1}
.night{font-family:var(--f-cond);font-size:26px;font-weight:700}

.scroll{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:min(78vh,1100px)}
table{border-collapse:separate;border-spacing:0}
.plan{width:100%;min-width:640px}
.plan th,.plan td{border-bottom:1px solid var(--line)}
.plan thead th{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:2px solid var(--ink);padding:12px 10px;text-align:left;font-family:var(--f-cond);font-size:20px;white-space:nowrap}
.plan thead th:first-child{left:0;z-index:4}
.plan thead th .ot{display:block;font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--red)}
.plan .ph{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;text-align:left;font-weight:400;min-width:190px;width:230px}
.plan td{padding:3px 4px;min-width:130px}
.grp th{position:sticky;left:0;background:var(--surface-2);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 10px;font-weight:700}
.grp td{background:var(--surface-2)}
.post{display:flex;align-items:center;gap:8px}
.code{font-family:var(--f-cond);font-weight:700;font-size:19px;min-width:30px;font-variant-numeric:tabular-nums}
.pname{font-size:15px;color:var(--ink-2)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px dashed var(--line-2);display:inline-block}
.dot.vert{background:var(--vert);border:0}.dot.orange{background:var(--orange);border:0}.dot.rouge{background:var(--rouge);border:0}
.cell{width:100%;min-height:48px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;padding:6px 10px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px}
.cell:hover{border-color:var(--line-2);background:var(--surface-2)}
.cell .empty{color:var(--muted);font-weight:400}
.cell.locked{box-shadow:inset 4px 0 0 var(--red);background:var(--red-soft)}
.force{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;width:100%;text-align:left}
.force .sw2{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;flex:none}
.force .sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .12s}
.force[aria-pressed="true"]{border-color:var(--red)}
.force[aria-pressed="true"] .sw2{background:var(--red)}
.force[aria-pressed="true"] .sw2::after{left:21px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;border-radius:5px;padding:1px 5px;background:var(--ink);color:var(--surface)}
.tag.h{background:var(--orange)}
.opt-row{display:flex;gap:6px;align-items:stretch;width:100%}
.opt-row .opt{flex:1}
.frm{flex:none;min-width:96px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted);font-weight:700;font-size:13px;padding:0 10px}
.frm[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.frm[disabled]{opacity:.4}
.start{background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.start p{margin:0;flex:1;min-width:220px;color:var(--ink-2)}

.legend{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:15px;color:var(--ink-2)}
.legend label,.legend span{display:inline-flex;align-items:center;gap:8px}
.legend input{width:20px;height:20px;accent-color:var(--red)}
.kpi{font-size:15px;color:var(--ink-2)}
.kpi b{font-family:var(--f-cond);font-size:22px;color:var(--ink);margin-left:4px}
.mx{min-width:max-content}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.mx thead th{position:sticky;top:0;z-index:3;background:var(--surface);vertical-align:bottom}
.mx .corner{position:sticky;left:0;z-index:4;background:var(--surface);min-width:240px}
.mx .ph{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:3px 8px;font-weight:400;min-width:240px}
.mx .who{width:38px;min-width:38px;padding:6px 0 4px}
.mx .who button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.mx .vname{writing-mode:vertical-rl;transform:rotate(180deg);font-size:14px;font-weight:600;white-space:nowrap;max-height:140px;overflow:hidden;text-overflow:ellipsis}
.mx .role{font-size:10px;font-weight:700;color:var(--muted)}
.mx .tlc{background:var(--tl)}
.mx .grp th{position:sticky;left:0}
.m{width:38px;height:36px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:4px}
.m:hover{outline:2px solid var(--red);outline-offset:-2px}
.sym{display:block;width:100%;height:100%;border-radius:2px}
.sym.G{background:var(--mark)}
.sym.H{background:repeating-linear-gradient(135deg,var(--mark) 0 2px,transparent 2px 6px)}
.sym.X{background:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--ink)}
.sw{display:inline-block;width:22px;height:18px;border:1px solid var(--line-2);border-radius:3px;padding:2px}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:99px;background:var(--ink);color:var(--surface);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mx .ph .cnt{margin-left:auto}
.tot{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;background:var(--surface-2);padding:6px 2px!important}
.dotbtn{border:0;background:none;padding:10px 6px;display:inline-flex}
.linkbtn{border:0;background:none;padding:6px 0;text-align:left;display:flex;align-items:center;gap:8px;min-height:36px}

.back{position:fixed;inset:0;background:rgba(12,14,16,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(620px,100%);max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.back{align-items:center}.sheet{border-radius:16px;max-height:84vh}}
.sheet.wide{width:min(1100px,100%)}
.sh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh h2{flex:1;font-size:22px}
.sb{overflow:auto;padding:12px 16px 20px;display:grid;gap:10px;align-content:start}
.sf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:600;font-size:16px}
.opt:hover{background:var(--surface-2);border-color:var(--line-2)}
.opt[aria-current="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opt small{margin-left:auto;color:var(--muted);font-weight:500;font-size:14px}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tog{min-height:48px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;padding:6px 10px;text-align:left}
.tog.off{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.tlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.tlrow b{min-width:90px}
.qb{min-width:52px;min-height:44px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:700}
.qb[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.field{display:grid;gap:6px}
.field span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.eq{min-width:max-content}
.eq th,.eq td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.eq thead th{position:sticky;top:0;background:var(--surface);font-family:var(--f-cond);font-size:17px;z-index:1}
.eq th.n{position:sticky;left:0;background:var(--surface);text-align:left;white-space:nowrap}
.eq td.z{color:var(--line-2)}
.eq td.c{font-weight:700}
.eq td.no{background:var(--surface-2);color:var(--line-2)}
/* ---- téléphone ---- */
.m-head{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px}
.m-head .night{text-align:center;font-size:21px}
.m-acts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.m-acts .btn{min-height:44px;padding:6px 4px;font-size:14px;white-space:normal;line-height:1.1;text-align:center}
.m-gen{width:100%}
.qtabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-3,var(--surface));padding:4px;border-radius:12px;border:1px solid var(--line)}
.qtabs button{min-height:48px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:17px;color:var(--ink-2)}
.qtabs button small{display:block;font-size:11px;font-weight:600;color:var(--red)}
.qtabs button[aria-pressed="true"]{background:var(--red);color:var(--red-ink)}
.qtabs button[aria-pressed="true"] small{color:var(--red-ink)}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mlist .g{padding:8px 14px;background:var(--surface-2);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mrow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left}
.mrow:first-child{border-top:0}
.mrow .who{margin-left:auto;font-weight:700;font-size:17px;text-align:right}
.mrow .who .empty{color:var(--muted);font-weight:400}
.mrow.locked{box-shadow:inset 4px 0 0 var(--red);background:var(--red-soft)}
.mrow.split{padding:0;display:flex;align-items:stretch}
.mrow.split .linkbtn{padding:8px 14px;flex:none;min-height:56px}
.mrow.split .pickbtn{flex:1;border:0;background:none;padding:8px 14px;min-height:56px;text-align:right;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.mrow.split .pickbtn:hover{background:var(--surface-2)}
.mrow.split .pickbtn .empty{color:var(--muted);font-weight:400}
.mrow .pname{display:inline!important;font-size:14px}
.pp-sel{width:100%;font-size:17px;font-weight:600}
.st3{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin-left:auto;flex:none}
.st3 button{min-width:46px;min-height:44px;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:6px}
.st3 button+button{border-left:1px solid var(--line-2)}
.st3 button[aria-pressed="true"]{background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red)}
.st3 .sw{width:24px;height:20px}
.mrow.static{cursor:default}
.bal .mrow .cntv{margin-left:auto;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.note{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:700px){.top{position:static}.top-in{gap:6px 12px}.tabs{width:100%}.tabs button{flex:1}}
@media (max-width:560px){.night{font-size:22px}.tabs{margin-left:0}.plan .ph{min-width:120px;width:130px}.pname{display:none}.plan td{min-width:110px}}
/* ---- logo animé ---- */
.brandbtn{position:relative;border:0;background:none;padding:2px 4px;border-radius:8px;overflow:hidden}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font-family:var(--f-cond);font-weight:700;font-size:22px;white-space:nowrap;letter-spacing:.01em}
.brand i{width:14px;height:14px;background:var(--red);border-radius:3px;display:block}
.brand span{color:var(--muted);font-weight:600}
.road{position:absolute;left:0;right:0;bottom:2px;height:6px;pointer-events:none;overflow:hidden;opacity:.55}
.road::before{content:"";position:absolute;inset:2px 0;background:repeating-linear-gradient(90deg,var(--line-2) 0 10px,transparent 10px 20px)}
.car{position:absolute;bottom:-2px;left:-40px;width:26px;height:12px;opacity:0}
.car svg{width:100%;height:100%;display:block}
.brandbtn.play .car.c1{animation:drive 1.6s ease-in-out 1}
.brandbtn.play .car.c2{animation:drive 1.6s ease-in-out .35s 1}
@keyframes drive{0%{opacity:0;transform:translateX(0)}6%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateX(160px)}}
/* ---- astuces & aide ---- */
.hint{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;white-space:normal}
.helpbtn{border-radius:99px}
/* ---- compte / connexion ---- */
.acct{display:flex;align-items:center;gap:8px;margin-left:8px;font-size:14px;color:var(--ink-2);font-weight:600}
.acct .role{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--tl);color:var(--ink-2)}
.acct .role.admin{background:var(--red);color:var(--red-ink)}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.authcard{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:grid;gap:14px}
.authcard h1{font-size:24px}
.namegrid{display:grid;gap:8px}
.namebtn{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:17px;text-align:left}
.namebtn:hover{background:var(--surface-2)}
.namebtn small{margin-left:auto;color:var(--muted);font-weight:600}
.setuprow{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.recap{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;display:grid;gap:2px;background:var(--surface-2)}
.recap b{font-size:16px}
.recap .code2{font-family:var(--f-cond);font-size:18px;letter-spacing:.04em}
/* ---- effectifs ---- */
.eff-row{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.eff-row:first-child{border-top:0}
.eff-row.pressing{background:var(--red-soft)}
.eff-row.off{background:var(--surface-2);color:var(--muted)}
.eff-row .pname{font-size:16px;font-weight:600}
.eff-row .absbadge{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--red)}
[data-long]{cursor:pointer}
@media print{
  html,body{background:#fff!important}
  body *{visibility:hidden}
  #printzone,#printzone *{visibility:visible}
  #printzone{display:block!important;position:absolute;left:0;top:0;width:100%}
  #printzone table{width:100%;border-collapse:collapse}
  #printzone th,#printzone td{border:1px solid #000!important;color:#000!important;background:#fff!important;padding:4px 6px;font-size:12px}
  #printzone .dot{border-color:#000!important;background:#fff!important}
  #printzone .dot.vert,#printzone .dot.orange,#printzone .dot.rouge{background:#fff!important;border:1.5px solid #000!important}
  #printzone h1{color:#000!important;font-size:18px;margin-bottom:6px}
}
</style>

<header class="top"><div class="top-in">

const fmt = s => { const a = s.split('-').map(Number); const t = new Date(a[0], a[1] - 1, a[2]).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}); return t.charAt(0).toUpperCase() + t.slice(1); };

/* ---------- data helpers ---------- */
const byOrder = a => a.sort((x, y) => ((x.order || 0) - (y.order || 0)) || String(x.code || x.name).localeCompare(String(y.code || y.name), 'fr', {numeric:true}));

const zones = ps => { const z = []; ps.forEach(p => { const k = p.zone || 'Autres'; if (!z.includes(k)) z.push(k); }); return z; };
const mark = (per, pid) => { const m = (per && per.marks && per.marks[pid]) || ''; return m === 'X' ? 'G' : m; };
const canHold = (per, pid) => { const m = mark(per, pid); return m === 'G' || m === 'H'; };

const nightOf = d => S.nights[d || S.date] || null;

/* ---------- engine ---------- */
function hungarian(cost){
  const n = cost.length, INF = 1e18;
  const u = new Float64Array(n + 1), v = new Float64Array(n + 1), p = new Int32Array(n + 1), way = new Int32Array(n + 1);
  for (let i = 1; i <= n; i++) {
    p[0] = i; let j0 = 0;
    const minv = new Float64Array(n + 1).fill(INF), used = new Uint8Array(n + 1);
    do {
      used[j0] = 1; const i0 = p[j0]; let delta = INF, j1 = 0;
      for (let j = 1; j <= n; j++) if (!used[j]) {
        const cur = cost[i0 - 1][j - 1] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }
      for (let j = 0; j <= n; j++) { if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta; }
      j0 = j1;
    } while (p[j0] !== 0);
    do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
  }
  const res = new Array(n).fill(-1);
  for (let j = 1; j <= n; j++) if (p[j]) res[p[j] - 1] = j - 1;
  return res;
}
/* what each person did on the previous nights: used to share posts fairly */
function history(date){
  const count = {}, red = {};
  const past = Object.values(S.nights).filter(n => n.date < date && generated(n)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, HIST_NIGHTS);
  past.forEach(n => (n.q || []).forEach((q, k) => Object.keys(q || {}).forEach(pid => {
    const who = q[pid]; if (!who) return;
    const w = (n.manual && n.manual[k] && n.manual[k][pid]) ? 0.4 : 1; /* une affectation faite à la main compense moins pour l’équilibre futur */
    count[who + '|' + pid] = (count[who + '|' + pid] || 0) + w;
    if (S.posts[pid] && S.posts[pid].diff === 'rouge') red[who] = (red[who] || 0) + w;
  })));
  return {count, red};
}
function holderMap(q){ const m = {}; Object.keys(q || {}).forEach(pid => { if (q[pid]) m[q[pid]] = pid; }); return m; }
/* one quart = best assignment of people to posts, given the other quarts of the night */
function buildQuart(k, night, hist){
  const absent = new Set(night.absent || []);
  Object.keys((night.qAbsent && night.qAbsent[k]) || {}).forEach(id => absent.add(id));
  const fixed = {}, fixedPeople = new Set();
  const lk = (night.lock && night.lock[k]) || {};
  Object.keys(lk).forEach(pid => { const who = lk[pid]; if (S.posts[pid] && S.people[who] && !absent.has(who) && !fixedPeople.has(who)) { fixed[pid] = who; fixedPeople.add(who); } });
  const ps = posts().filter(p => !fixed[p.id]);
  const cands = activePeople().filter(per => !absent.has(per.id) && !fixedPeople.has(per.id) && ((!isTL(per) && !isTemp(per)) || (night.tl && night.tl[per.id] && night.tl[per.id][k])));
  const P = ps.length, N = cands.length, n = P + N, BAN = 1e7, EMPTY = 5000;
  const others = [];
  for (let j = 0; j < nq(night); j++) if (j !== k && night.q[j] && Object.keys(night.q[j]).length) others.push({j, m:holderMap(night.q[j])});
  const M = [];
  for (let i = 0; i < n; i++) {
    const row = new Array(n);
    for (let j = 0; j < n; j++) {
      let c;
      if (i < P && j < N) {
        const p = ps[i], per = cands[j];
        if (!canHold(per, p.id)) c = BAN;
        else {
          c = 15 * (hist.count[per.id + '|' + p.id] || 0) + Math.random() * 12;
          others.forEach(o => { if (o.m[per.id] === p.id) c += 600; });
          if (p.diff === 'rouge') {
            c += 6 * (hist.red[per.id] || 0);
            others.forEach(o => { if (Math.abs(o.j - k) === 1 && S.posts[o.m[per.id]] && S.posts[o.m[per.id]].diff === 'rouge') c += 150; });
          }
        }
      } else if (i < P) c = (j - N === i) ? EMPTY : BAN;
      else if (j < N) {
        const per = cands[j];
        if (isTL(per)) c = 3000;
        else { c = 0; others.forEach(o => { if (!o.m[per.id]) c += 60; }); }
      } else c = 0;
      row[j] = c;
    }
    M.push(row);
  }
  const a = hungarian(M), out = Object.assign({}, fixed);
  for (let i = 0; i < P; i++) { const j = a[i]; if (j >= 0 && j < N && M[i][j] < BAN) out[ps[i].id] = cands[j].id; }
  return out;
}
function freshNight(date){ return {date, ot:0, generated:false, q:[{}, {}, {}, {}, {}], lock:[{}, {}, {}, {}, {}], train:[{}, {}, {}, {}, {}], manual:[{}, {}, {}, {}, {}], qAbsent:[{}, {}, {}, {}, {}], absent:[], tl:{}}; }
function editable(date){ const n = nightOf(date); const c = n ? clone(n) : freshNight(date || S.date); c.q = [0, 1, 2, 3, 4].map(k => (c.q && c.q[k]) || {}); c.lock = [0, 1, 2, 3, 4].map(k => (c.lock && c.lock[k]) || {}); c.train = [0, 1, 2, 3, 4].map(k => (c.train && c.train[k]) || {}); c.manual = [0, 1, 2, 3, 4].map(k => (c.manual && c.manual[k]) || {}); c.qAbsent = [0, 1, 2, 3, 4].map(k => (c.qAbsent && c.qAbsent[k]) || {}); c.absent = c.absent || []; c.tl = c.tl || {}; return c; }
function generateAll(night){
  const hist = history(night.date);
  night.q = [{}, {}, {}, {}, {}];
  for (let k = 0; k < nq(night); k++) night.q[k] = buildQuart(k, night, hist);
  night.lock = [{}, {}, {}, {}, {}]; /* un forçage ne vaut que pour la génération qui vient de tourner */
  night.manual = [{}, {}, {}, {}, {}]; /* une fois régénéré, l’affectation redevient « générée » pour l’équilibre futur */

}
function regenQuart(night, k){ night.q[k] = {}; night.q[k] = buildQuart(k, night, history(night.date)); night.lock[k] = {}; night.manual[k] = {}; }

/* ---------- persistence (Supabase Postgres ; la vraie protection est faite

function nightToRow(n){ return {date:n.date, ot:n.ot || 0, generated:!!n.generated, q:n.q, lock:n.lock, train:n.train, manual:n.manual, q_absent:n.qAbsent, absent:n.absent || [], tl:n.tl || {}}; }
function rowToNight(r){ return {date:r.date, ot:r.ot || 0, generated:!!r.generated, q:r.q || [{}, {}, {}, {}, {}], lock:r.lock || [{}, {}, {}, {}, {}], train:r.train || [{}, {}, {}, {}, {}], manual:r.manual || [{}, {}, {}, {}, {}], qAbsent:r.q_absent || [{}, {}, {}, {}, {}], absent:r.absent || [], tl:r.tl || {}}; }
function personToRow(p){ return {id:p.id, name:p.name, role:p.role || 'TM', temp:!!p.temp, order_num:p.order || 0, marks:p.marks || {}, active:p.active !== false}; }
function rowToPerson(r){ return {id:r.id, name:r.name, role:r.role || 'TM', temp:!!r.temp, order:r.order_num || 0, marks:r.marks || {}, active:r.active !== false}; }

let rq = false;

function render(){

function viewPlan(){

  const absent = n ? (n.absent || []).length : 0;
  const tlOn = n ? Object.values(n.tl || {}).filter(a => a && a.some(Boolean)).length : 0;
  const crewInfo = [absent ? absent + ' absent' + (absent > 1 ? 's' : '') : '', tlOn ? tlOn + ' TL' : ''].filter(Boolean).join(' · ');
  let html = '<div class="bar"><button type="button" class="icon" data-act="day" data-d="-1" aria-label="Nuit précédente">‹</button>'
    + '<span class="night">' + esc(fmt(S.date)) + '</span>'
    + '<button type="button" class="icon" data-act="day" data-d="1" aria-label="Nuit suivante">›</button>'

    body += '<tr class="grp"><th scope="rowgroup">' + esc(z) + '</th><td colspan="' + Q + '"></td></tr>';

          + (per ? esc(per.name) + (isTL(per) ? ' <span class="tag">TL</span>' : '') + (mark(per, p.id) === 'H' ? ' <span class="tag h">🎓 Formation</span>' : '') : '<span class="empty">—</span>')

}
function printZone(n, Q, ps){

function shPick(s){
  const p = S.posts[s.post]; if (!p) return null;

  const swappable = per => { const w = where[per.id]; if (!w || w === p.id || !cur) return true; return !!(curPer && canHold(curPer, w)); };
  const othersAll = pres.filter(per => !isTL(per) && onQuart(per));

    const m = mark(per, p.id), tag = m === 'H' ? ' — en formation' : '';
    return '<option value="' + esc(per.id) + '"' + (cur === per.id ? ' selected' : '') + '>' + esc(per.name) + esc(tag) + (where[per.id] && where[per.id] !== p.id && S.posts[where[per.id]] ? ' (sur ' + esc(S.posts[where[per.id]].code) + ')' : '') + (adjRepeat(per) ? ' ⚠️ déjà ce poste au quart voisin' : '') + '</option>';
  }).join('') + '</select>' + (!others.length ? '<p class="note">Personne d’autre d’habilité et disponible pour un échange sur ce poste.</p>' : '');
  body += '<button type="button" class="opt" data-act="choose" data-id="">Laisser vide</button>';
  const curTrain = n && n.train && n.train[s.k] ? n.train[s.k][p.id] : null;
  body += '<button type="button" class="force" data-act="toggleFrm" aria-pressed="' + !!s.showFrm + '">🎓 Ajouter quelqu’un en formation avec ' + (cur && S.people[cur] ? esc(S.people[cur].name) : 'le titulaire') + '</button>';
  if (s.showFrm) {

    body += trainable.length ? trainable.map(per => '<button type="button" class="opt" data-act="chooseTrain" data-k="' + s.k + '" data-post="' + esc(p.id) + '" data-id="' + esc(per.id) + '"' + (curTrain === per.id ? ' aria-current="true"' : '') + '>' + esc(per.name) + (where[per.id] && where[per.id] !== p.id && S.posts[where[per.id]] ? '<small>sur ' + esc(S.posts[where[per.id]].code) + '</small>' : '') + '</button>').join('') : '<p class="note">Personne en formation sur ce poste (coché hachuré dans Polyvalence).</p>';

function shBalance(s){
  if (phone()) { const span0 = s.span || 30; const from0 = addDays(S.date, -(span0 - 1)); return shBalancePhone(s, Object.values(S.nights).filter(n => generated(n) && n.date >= from0 && n.date <= S.date)); }
  const span = s.span || 30;
  const from = addDays(S.date, -(span - 1));
  const list = Object.values(S.nights).filter(n => generated(n) && n.date >= from && n.date <= S.date);
  const ps = posts(), count = {}, tot = {};
  list.forEach(n => (n.q || []).forEach(q => Object.keys(q || {}).forEach(pid => { const w = q[pid]; if (!w) return; count[w + '|' + pid] = (count[w + '|' + pid] || 0) + 1; tot[w] = (tot[w] || 0) + 1; })));
  const pp = people().filter(per => !isTL(per) || tot[per.id]);
  let t = '<table class="eq"><thead><tr><th class="n" scope="col"></th>' + ps.map(p => '<th scope="col"><span class="dot ' + esc(p.diff || '') + '" style="margin-right:3px"></span>' + esc(p.code) + '</th>').join('') + '<th scope="col">Total</th></tr></thead><tbody>';
  pp.forEach(per => {
    t += '<tr><th class="n" scope="row">' + esc(per.name) + '</th>' + ps.map(p => { const v = count[per.id + '|' + p.id] || 0; return !canHold(per, p.id) && !v ? '<td class="no">·</td>' : '<td class="' + (v ? 'c' : 'z') + '">' + v + '</td>'; }).join('') + '<td class="c">' + (tot[per.id] || 0) + '</td></tr>';
  });
  t += '</tbody></table>';
  const body = '<div class="bar"><button type="button" class="btn btn-sm' + (span === 7 ? ' btn-red' : '') + '" data-act="span" data-v="7">7 derniers jours</button><button type="button" class="btn btn-sm' + (span === 30 ? ' btn-red' : '') + '" data-act="span" data-v="30">30 derniers jours</button><span class="muted">' + list.length + ' nuit' + (list.length > 1 ? 's' : '') + '</span></div><div class="scroll" data-scroll="eq" style="max-height:60vh">' + t + '</div><p class="note">Nombre de quarts faits sur chaque poste. « · » : poste qu’il ne tient pas.</p>';
  return {title:'Équilibre', body, wide:true};
}

  async toggleActive(d){
    try { await callAdminAction({action:'toggleActive', id:d.id}); S.accountsErr = ''; }
    catch (e) { S.accountsErr = 'Erreur : ' + e.message; }
    renderSheet();
  }
};
const C = {
  person(el){ S.person = el.value; render(); },
  balPerson(el){ S.balPerson = el.value; renderSheet(); },
  pickPerson(el){ A.choose({id:el.value}); },
  date(el){ S.date = el.value || today(); render(); },
  countH(el){ S.cfg.countH = el.checked; saveCfg(); },
  countX(el){ S.cfg.countX = el.checked; saveCfg(); },
  pName(el){ const v = el.value.trim(); if (!v) return; const per = clone(S.people[S.sheet.id]); per.name = v; savePerson(per); },
  pRole(el){ const per = clone(S.people[S.sheet.id]); per.role = el.value; savePerson(per); },
  poCode(el){ const v = el.value.trim(); if (!v) return; const p = clone(S.posts[S.sheet.id]); p.code = v; savePost(p); },
  poName(el){ const v = el.value.trim(); if (!v) return; const p = clone(S.posts[S.sheet.id]); p.name = v; savePost(p); },
  poZone(el){ const p = clone(S.posts[S.sheet.id]); p.zone = el.value.trim(); savePost(p); },
  loginPass(el){ S.loginPass = el.value; },
  newPass(el){ S.newPass = el.value; },
  newPass2(el){ S.newPass2 = el.value; },
  newTLName(el){ S.newTLName = el.value; },
  teamName(el){ S.cfg.team = el.value; saveCfg(); },
  absFrom(el){ S.sheet.from = el.value; },
  absTo(el){ S.sheet.to = el.value; }
};
let pressTimer = null, suppressClick = false;
function cancelPress(){ clearTimeout(pressTimer); pressTimer = null; }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-long]'); if (!el) return;
  cancelPress();
  pressTimer = setTimeout(() => {
    suppressClick = true;
    const f = A[el.dataset.long]; if (f) f(el.dataset);
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (e2) {}
  }, 480);
});
['pointerup', 'pointercancel', 'pointermove', 'pointerleave'].forEach(ev => document.addEventListener(ev, cancelPress));
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; }
  if (e.target.classList && e.target.classList.contains('back')) { close(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f) f(el.dataset);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && C[el.dataset.chg]) C[el.dataset.chg](el); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) close(); });

/* ---------- boot (Supabase : chargement + temps réel) ---------- */
let profileChannel = null, bizChannels = [];
function teardownBiz(){ bizChannels.forEach(ch => { try { sb.removeChannel(ch); } catch (e) {} }); bizChannels = []; }
function subscribeTable(list, table, pk, onUpsert, onDelete){
  const ch = sb.channel('rt:' + table + ':' + Math.random().toString(36).slice(2))
    .on('postgres_changes', {event:'*', schema:'public', table}, payload => {
      if (payload.eventType === 'DELETE') onDelete((payload.old || {})[pk]); else onUpsert(payload.new);
    })
    .subscribe();
  list.push(ch);
  return ch;
}
async function loadProfiles(){
  const {data, error} = await sb.from('profiles').select('*');
  if (!error) { const o = {}; (data || []).forEach(r => { o[r.id] = r; }); S.profiles = o; }
  if (!profileChannel) profileChannel = subscribeTable([], 'profiles', 'id', r => { S.profiles[r.id] = r; later(); }, id => { delete S.profiles[id]; later(); });
  later();
}
async function loadBusinessData(){
  const [ppl, pst, nts, cfgRow] = await Promise.all([
    sb.from('people').select('*'),
    sb.from('posts').select('*'),
    sb.from('nights').select('*').order('date', {ascending:false}).limit(400),
    sb.from('config').select('*').eq('key', 'main').maybeSingle()
  ]);
  S.people = {}; (ppl.data || []).forEach(r => { S.people[r.id] = rowToPerson(r); });
  S.posts = {}; (pst.data || []).forEach(r => { S.posts[r.id] = rowToPost(r); });
  S.nights = {}; (nts.data || []).forEach(r => { S.nights[r.date] = rowToNight(r); });
  S.cfg = Object.assign({}, DEFAULT_CFG, (cfgRow.data && cfgRow.data.value) || {});
  S.ready = true;
  teardownBiz();
  subscribeTable(bizChannels, 'people', 'id', r => { S.people[r.id] = rowToPerson(r); later(); }, id => { delete S.people[id]; later(); });
  subscribeTable(bizChannels, 'posts', 'id', r => { S.posts[r.id] = rowToPost(r); later(); }, id => { delete S.posts[id]; later(); });
  subscribeTable(bizChannels, 'nights', 'date', r => { S.nights[r.date] = rowToNight(r); later(); }, date => { delete S.nights[date]; later(); });
  subscribeTable(bizChannels, 'config', 'key', r => { if (r.key === 'main') S.cfg = Object.assign({}, DEFAULT_CFG, r.value || {}); later(); }, () => {});
  render();
}
async function boot(){
  await loadProfiles();
  const {data:{session}} = await sb.auth.getSession();
  S.authUser = session ? session.user : null;
  S.authReady = true;
  if (S.authUser) { await loadBusinessData(); } else { render(); }
  sb.auth.onAuthStateChange(async (event, session) => {
    const newUser = session ? session.user : null;
    const changed = (newUser && newUser.id) !== (S.authUser && S.authUser.id);
    S.authUser = newUser; S.authReady = true;
    if (newUser) { S._forcedOut = false; if (changed) await loadBusinessData(); else render(); }
    else { teardownBiz(); S.people = {}; S.posts = {}; S.nights = {}; S.ready = false; S._forcedOut = false; render(); }
  });
  /* tient à jour l'écran « fermé hors horaires » sans que le TL ait à recharger */
  setInterval(() => { if (S.authUser && profile()) render(); }, 60000);
}
render();
boot();
})();
</script>
