<style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#131517;color:#ECEEF0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}#ouverture{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#131517;transition:opacity .3s ease-out}#ouverture.sortie{opacity:0;pointer-events:none}#ouverture img{width:240px;height:240px;max-width:none;clip-path:circle(80px)}
/* retour visuel au toucher */
.btn,.opt,.cell,.pickbtn,.qb,.eff-row,.gear{transition:transform .08s ease-out,filter .08s ease-out}
.btn,.icon,.qtabs button,.st3 button,.tabs button{transition:transform .12s ease-out,filter .12s ease-out}
.btn:active,.opt:active,.cell:active,.pickbtn:active,.qb:active,.eff-row:active,.gear:active,.icon:active,.qtabs button:active,.st3 button:active,.tabs button:active{transform:scale(.96);filter:brightness(.9)}
#main{font-variant-numeric:tabular-nums}
/* bandeau hors connexion */
#offbar{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:#3A161A;border:1px solid var(--red);color:var(--ink);font-weight:700;font-size:14px;border-radius:10px;padding:8px 12px;width:max-content;max-width:calc(100% - 24px);text-align:center}
/* question « tient-il le poste ? » */
/* qui n'a pas de poste sur le quart */
.freebox{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.freebox > button{width:100%;display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 14px;border:0;background:none;font:inherit;font-weight:700;color:var(--ink-2);text-align:left}
.freebox > button .n{color:var(--orange)}
.freebox > button .chev{margin-left:auto;color:var(--muted)}
.freebox .fr{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:15px}
.freebox .fr small{color:var(--muted)}
.freebox .fr .st{margin-left:auto;font-size:13px;font-weight:700;text-align:right}
.freebox .st.tr{color:var(--orange)}.freebox .st.idle{color:var(--muted);font-weight:600}
tr.freerow th,tr.freerow td{font-size:13px;color:var(--ink-2);vertical-align:top;padding-top:8px}
tr.freerow td span{display:block;padding:1px 10px}
.tag.am{background:#16263a;color:#7FB2F0;border:1px solid #2b4566}
/* passer d'un onglet à l'autre en glissant */
@keyframes swl{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-28px);opacity:.4}to{transform:none;opacity:1}}
#main.swl{animation:swl .18s ease-out}#main.swr{animation:swr .18s ease-out}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pgrid .opt{flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:56px;padding:6px 4px;text-align:center}
.pgrid .opt small{margin:0;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){#main.swl,#main.swr,#main .qin{animation:none}.btn:active,.opt:active,.cell:active,.pickbtn:active,.qb:active,.eff-row:active,.gear:active,.icon:active,.qtabs button:active,.st3 button:active,.tabs button:active{transform:none}}
@keyframes qin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#main .qin{animation:qin .22s ease-out both}

<style>
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#F7F8F9; --line:#DADDE1; --line-2:#80878F;
  --ink:#1E2125; --ink-2:#4A4F56; --muted:#7B8189;
  --red:#EB0A1E; --red-ink:#FFFFFF; --red-soft:#FDE8EA; --red-fill:#EB0A1E;
  --hm0:#E9ECEF; --hm1:#cde2fb; --hm2:#9ec5f4; --hm3:#6da7ec; --hm4:#3987e5; --hm5:#256abf; --hm-ring:#2a78d6;
  --mark:#5B6067; --tl:#ECEEF1;
  --vert:#2E9A58; --orange:#EE8A00; --rouge:#D3203A; --bleu:#2F6FDE;
  --f-ui:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131517; --surface:#1C1F22; --surface-2:#222629; --line:#32373C; --line-2:#6A7179;
    --ink:#ECEEF0; --ink-2:#B5BBC1; --muted:#868D94;
    --red:#FF3347; --red-ink:#FFFFFF; --red-soft:#3A161A; --red-fill:#D90F26;
    --hm0:#2A2F34; --hm1:#104281; --hm2:#1c5cab; --hm3:#2a78d6; --hm4:#5598e7; --hm5:#86b6ef; --hm-ring:#5598e7;
    --mark:#A9AEB4; --tl:#262A2E;
    --vert:#4CC07C; --orange:#FFA630; --rouge:#FF5A6E; --bleu:#7AA8FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131517; --surface:#1C1F22; --surface-2:#222629; --line:#32373C; --line-2:#6A7179;
  --ink:#ECEEF0; --ink-2:#B5BBC1; --muted:#868D94;
  --red:#FF3347; --red-ink:#FFFFFF; --red-soft:#3A161A; --red-fill:#D90F26;
  --hm0:#2A2F34; --hm1:#104281; --hm2:#1c5cab; --hm3:#2a78d6; --hm4:#5598e7; --hm5:#86b6ef; --hm-ring:#5598e7;
  --mark:#A9AEB4; --tl:#262A2E;
  --vert:#4CC07C; --orange:#FFA630; --rouge:#FF5A6E; --bleu:#7AA8FF;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#sheet.hold{pointer-events:none}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.35;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
h1,h2{font-family:var(--f-cond);font-weight:700;margin:0;letter-spacing:.01em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-top:4px solid var(--red);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-cond);font-weight:700;font-size:22px;white-space:nowrap}
.brand .brandicon{width:1.05em;height:1.05em;border-radius:22%;display:block;flex:0 0 auto;object-fit:cover}
.brand span{color:var(--muted);font-weight:600}
.brand .wmteam{color:var(--red)}
.tabs{display:flex;gap:4px;margin-left:auto;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:10px 16px;border-radius:10px;font-weight:600;color:var(--ink-2);min-height:46px;font-size:16px;white-space:nowrap}
.tabs button .s{display:none}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--surface)}
main{max-width:1280px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:14px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-red{background:var(--red-fill);border-color:var(--red-fill);color:var(--red-ink)}
.btn-red:hover{background:var(--red-fill);filter:brightness(1.07)}
.btn-formation{background:var(--orange);border-color:var(--orange);color:#1E2125;font-weight:700}
.btn-formation:hover{filter:brightness(1.06)}
.btn-suggest{background:var(--orange);border-color:var(--orange);color:#1E2125;font-weight:700}
.btn-suggest:hover{filter:brightness(1.06)}
.btn-sm{min-height:44px;padding:6px 12px;font-size:15px}
.icon{width:46px;height:46px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
input[type=date],input[type=text],select{min-height:46px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:6px 10px}
input[type=text]{width:100%}

.bar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.bar .grow{flex:1}
.night{font-family:var(--f-cond);font-size:26px;font-weight:700}

.scroll{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:min(78vh,1100px);min-width:0}
table{border-collapse:separate;border-spacing:0}
.plan{width:100%;min-width:640px}
.plan th,.plan td{border-bottom:1px solid var(--line)}
.plan thead th{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:2px solid var(--ink);padding:12px 10px;text-align:left;font-family:var(--f-cond);font-size:20px;white-space:nowrap}
.plan thead th:first-child{left:0;z-index:4}
.plan thead th .ot{display:block;font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--red)}
.plan .ph{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;text-align:left;font-weight:400;min-width:190px;width:230px}
.plan td{padding:3px 4px;min-width:130px}
.grp th{position:sticky;left:0;background:var(--surface-2);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 10px;font-weight:700}
.grp td{background:var(--surface-2)}
.post{display:flex;align-items:center;gap:8px}
.code{font-family:var(--f-cond);font-weight:700;font-size:18px;min-width:30px;font-variant-numeric:tabular-nums}
.pname{font-size:15px;color:var(--ink-2)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px dashed var(--line-2);display:inline-block}
.dot.vert{background:var(--vert);border:0}.dot.orange{background:var(--orange);border:0;border-radius:4px;transform:rotate(45deg) scale(.82)}.dot.rouge{background:var(--rouge);border:0;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.cell{width:100%;min-height:48px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;padding:6px 10px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px}
.cell:hover{border-color:var(--line-2);background:var(--surface-2)}
.cell .empty{color:var(--muted);font-weight:400}
.cell.locked{box-shadow:inset 4px 0 0 var(--red);background:var(--red-soft)}
.force{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;width:100%;text-align:left}
.force .sw2{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;flex:none}
.force .sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .12s}
.force[aria-pressed="true"]{border-color:var(--red)}
.force[aria-pressed="true"] .sw2{background:var(--red)}
.force[aria-pressed="true"] .sw2::after{left:21px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;border-radius:4px;padding:1px 5px;background:var(--ink);color:var(--surface)}
.tag.h{background:var(--orange)}
.opt-row{display:flex;gap:6px;align-items:stretch;width:100%}
.opt-row .opt{flex:1}
.frm{flex:none;min-width:96px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted);font-weight:700;font-size:13px;padding:0 10px}
.frm[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.frm[disabled]{opacity:.4}
.start{background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.start p{margin:0;flex:1;min-width:220px;color:var(--ink-2)}

.legend{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:15px;color:var(--ink-2)}
.legend label,.legend span{display:inline-flex;align-items:center;gap:8px}
.legend input{width:20px;height:20px;accent-color:var(--red)}
.kpi{font-size:15px;color:var(--ink-2)}
.kpi b{font-family:var(--f-cond);font-size:22px;color:var(--ink);margin-left:4px}
.mx{min-width:max-content}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.mx thead th{position:sticky;top:0;z-index:3;background:var(--surface);vertical-align:bottom}
.mx .corner{position:sticky;left:0;z-index:4;background:var(--surface);min-width:240px}
.mx .ph{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:3px 8px;font-weight:400;min-width:240px}
.mx .who{width:38px;min-width:38px;padding:6px 0 4px}
.mx .who button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.mx .vname{writing-mode:vertical-rl;transform:rotate(180deg);font-size:14px;font-weight:600;white-space:nowrap;max-height:140px;overflow:hidden;text-overflow:ellipsis}
.mx .who .trainerchk{margin-top:4px;font-size:13px;line-height:1;padding:2px 0;opacity:.3;filter:grayscale(1)}
.mx .who .trainerchk.on{opacity:1;filter:none}

  if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');

  for (let k = 0; k < nq(night); k++) night.q[k] = keep.has(k) ? kq[k] : buildQuart(k, night, hist);
  night.lock = [{}, {}, {}, {}, {}]; /* un forçage ne vaut que pour la génération qui vient de tourner */
  night.manual = [{}, {}, {}, {}, {}]; /* une fois régénéré, l’affectation redevient « générée » pour l’équilibre futur */
  keep.forEach(k => { night.lock[k] = kl[k]; night.manual[k] = km[k]; });

function replacementOptions(n, k, postId, banId){

  const free = pool.filter(per => onQuart(n, k, per) && !where[per.id]);
  const tlPenalty = per => isTL(per) ? 800 : 0; /* un TL ne prend un poste qu'en dernier recours */

  const add = (steps, cost) => { const key = steps.map(s => s.post + ':' + s.who).join('|'); if (seen.has(key)) return; seen.add(key); opts.push({steps, cost}); };

    const p2 = where[B.id];

    const post2 = S.posts[p2]; if (!post2) return;

    if ((n.absent || []).includes(per.id) || (n.qAbsent[k] || {})[per.id] || !fitFor(per, postId, n)) return;

/* pourquoi un poste est vide sur un quart : pour expliquer au lieu de masquer */
function whyEmpty(n, k, postId){
  const holders = activePeople().filter(per => canHoldAlone(per, postId));
  if (!holders.length) return 'personne n’est qualifié (G) sur ce poste';
  const where = holderMap(n.q[k] || {}), parts = [];
  const cnt = f => holders.filter(f).length;
  const abs = cnt(per => (n.absent || []).includes(per.id));
  const qabs = cnt(per => !(n.absent || []).includes(per.id) && (n.qAbsent[k] || {})[per.id]);
  const rest = cnt(per => isRestricted(per, postId, n.date));
  const off = cnt(per => (isTL(per) || isTemp(per)) && !(n.absent || []).includes(per.id) && !(n.tl[per.id] && n.tl[per.id][k]));
  const busy = cnt(per => where[per.id] && onQuart(n, k, per));
  if (abs) parts.push(abs + ' absent' + (abs > 1 ? 's' : '') + ' cette nuit');
  if (qabs) parts.push(qabs + ' absent' + (qabs > 1 ? 's' : '') + ' sur ce quart');
  if (rest) parts.push(rest + ' avec restriction');
  const offc = cnt(per => isOffQ(n, per.id, k) && !(n.absent || []).includes(per.id));
  if (offc) parts.push(offc + ' hors ligne');
  if (off) parts.push(off + ' TL/renfort non prévu' + (off > 1 ? 's' : '') + ' sur ce quart');
  if (busy) parts.push(busy + ' déjà placé' + (busy > 1 ? 's' : '') + ' sur un autre poste');
  return holders.length + ' qualifié' + (holders.length > 1 ? 's' : '') + (parts.length ? ' : ' + parts.join(', ') : '');
}

/* supabase-js ne rejette pas en cas d'échec (réseau coupé, refus de la base) : il renvoie {error}.
   Un échec est donc détecté sur r.error, gardé dans « failed » et signalé par un bandeau qui reste
   affiché ; nouvel essai au retour du réseau, toutes les 30 s, ou avec le bouton « Réessayer ». */

function queued(key, fn){

    .catch(e => { console.error('enregistrement', key, e); failed[key] = fn; saveBar(); })
    .finally(() => { pendingSaves--; });

}

function retryFailed(){ Object.keys(failed).forEach(k => queued(k, failed[k])); }

}

/* ---------- formations de la nuit, choisies avant de générer ----------
   1) « Ce soir, N personnes présentes sont en formation : combien en former ? » (0…N, ⭐ conseillé) ;
   2) une carte par personne : son poste en formation (hachuré dans Polyvalence), ce que la
      validation apporterait au poste (titulaires), puis Sur ligne / Q1, Q2… / Hors ligne.
   Places conseillées = personnes présentes en plus des postes sur le quart. Couvrir les postes
   passe toujours avant : à la génération, un stagiaire peut être repris pour un poste qui resterait
   vide (sa formation est alors retirée). Les personnes sans aucune case hachurée ne sont pas dans
   la liste : elles sont seulement suggérées à part (💡), avec un bouton pour les ajouter. */
const TRAIN_MAX_Q = 2;
function trainingPlan(night, scope){
  /* calcul sur la nuit sans personne « hors ligne » : c'est cet écran qui décide qui l'est */
  const n = Object.assign({}, night, {tl:Object.assign({}, night.tl, {_off:{}})});
  const Q = nq(n), allPosts = posts(), P = allPosts.length, absent = new Set(n.absent || []);
  const held = per => allPosts.filter(p => mark(per, p.id) === 'G').length;
  const holders = (pid, ex) => activePeople().filter(h => h.id !== ex && !absent.has(h.id) && fitFor(h, pid, n));
  /* quarts concernés par cette génération (Q1 seulement, le reste…) ; un quart validé 🔒 ne bouge pas */
  const inS = k => (!scope || scope.includes(k)) && !qvOf(n, k);
  const canOn = (id, k) => !!S.people[id] && onQuart(n, k, S.people[id]);
  /* quart possible : la personne est là, et un titulaire qualifié aussi */
  const canQ = (id, pid, k) => inS(k) && canOn(id, k) && activePeople().some(h => h.id !== id && onQuart(n, k, h) && fitFor(h, pid, n));
  const present = [];
  for (let k = 0; k < Q; k++) present.push(activePeople().filter(per => onQuart(n, k, per)).length);
  const places = present.map((c, k) => inS(k) ? Math.max(0, c - P) : 0);
  /* formations déjà posées sur la nuit (régénération) : reprises telles quelles */
  const cur = {};
  for (let k = 0; k < Q; k++) if (inS(k)) Object.keys(n.train[k] || {}).forEach(pid => { const id = n.train[k][pid]; (cur[id] = cur[id] || {post:pid, ks:[]}).ks.push(k); });
  const team = activePeople().filter(per => !isTL(per) && !isTemp(per) && !absent.has(per.id));
  const options = (per, m) => allPosts.filter(p => (m ? mark(per, p.id) === m : !mark(per, p.id)) && !isRestricted(per, p.id, n.date))
    .map(p => { const hs = holders(p.id, per.id); return {id:p.id, nb:hs.length, tr:hs.some(isFormateur), red:p.diff === 'rouge'}; })
    .filter(x => x.nb).sort((a, b) => a.nb - b.nb || b.tr - a.tr);
  const list = [];
  team.forEach(per => {
    const ps = options(per, 'H'); if (!ps.length) return;
    const c = cur[per.id], post = c && ps.some(x => x.id === c.post) ? c.post : ps[0].id;
    list.push({id:per.id, posts:ps, post, held:held(per), keep:!!c, ks:c ? c.ks.slice() : [], off:offKs(night, per.id).slice(), rec:[]});
  });
  const nbOf = e => (e.posts.find(x => x.id === e.post) || {nb:0}).nb;
  list.sort((a, b) => b.keep - a.keep || nbOf(a) - nbOf(b) || a.held - b.held || S.people[a.id].name.localeCompare(S.people[b.id].name, 'fr'));
  /* quarts conseillés : les places en plus, TRAIN_MAX_Q quarts au plus chacun, qui se suivent si possible */
  const left = places.slice();
  list.forEach(e => { if (e.keep) { e.rec = e.ks.slice(); e.ks.forEach(k => { left[k] = Math.max(0, left[k] - 1); }); } });
  for (let r = 0; r < TRAIN_MAX_Q; r++) list.forEach(e => {
    if (e.keep) return;
    let best = null;
    for (let k = 0; k < Q; k++) {
      if (!left[k] || e.rec.includes(k) || !canQ(e.id, e.post, k)) continue;
      const sc = left[k] + (e.rec.some(j => Math.abs(j - k) === 1) ? 100 : 0);
      if (!best || sc > best.sc) best = {k, sc};
    }
    if (best) { e.rec.push(best.k); left[best.k]--; }
  });
  list.forEach(e => { e.rec.sort((a, b) => a - b); e.recd = !!e.rec.length; });
  list.sort((a, b) => b.recd - a.recd); /* tri stable : les conseillés d'abord */
  /* 💡 personnes sans aucune case hachurée : suggérer un process (le moins de titulaires),
     poste difficile seulement si un formateur le tient ; 3 au plus, postes variés */
  const aimed = {}; list.forEach(e => { aimed[e.post] = (aimed[e.post] || 0) + 1; });
  const news = [];
  team.filter(per => !list.some(e => e.id === per.id) && !allPosts.some(p => mark(per, p.id) === 'H') && held(per) < P)
    .sort((a, b) => held(a) - held(b) || a.name.localeCompare(b.name, 'fr'))
    .forEach(per => {
      if (news.length >= 3) return;
      const o = options(per, '').filter(x => !x.red || x.tr).sort((a, b) => (aimed[a.id] || 0) - (aimed[b.id] || 0) || a.nb - b.nb || b.tr - a.tr)[0];
      if (o) { news.push({id:per.id, post:o.id, nb:o.nb, held:held(per)}); aimed[o.id] = (aimed[o.id] || 0) + 1; }
    });
  /* effectif juste : ce qu'il faudrait préparer (postes peu tenus, personnes peu polyvalentes) */
  const fragile = allPosts.map(p => ({p, nb:activePeople().filter(h => !absent.has(h.id) && fitFor(h, p.id, n)).length})).filter(x => x.nb <= 2).sort((a, b) => a.nb - b.nb).slice(0, 4);
  const weak = team.filter(per => held(per) <= 2).sort((a, b) => held(a) - held(b)).slice(0, 4).map(per => ({per, nb:held(per)}));
  return {Q, P, present, places, list, recCount:list.filter(e => e.recd).length, news, fragile, weak, canQ, canOn, inS, offKeep:Object.keys(offOf(night)).filter(id => !list.some(e => e.id === id)).reduce((o, id) => { o[id] = offKs(night, id); return o; }, {})};
}
const firstQ = (pl, id, pid) => { for (let k = 0; k < pl.Q; k++) if (pl.canQ(id, pid, k)) return [k]; return []; };
function pgPostLine(e, i){

/* ---------- roulette : appui long sur une case du planning ----------

let RW = null;

/* ---------- fiche « mettre en formation » ---------- */

/* ---------- cinématique « le tirage » ----------
   Pendant la génération, les noms défilent dans les cases des quarts concernés comme
   une machine à sous ; une fois le calcul ET l'enregistrement dans Supabase terminés,
   les quarts se figent un par un (Q1, Q2…) sur le vrai résultat. Durée : tout le

  const pp = S._spinNames || [];

}
function spinning(k){ const sh = S.shuffle; return !!(sh && sh.date === S.date && sh.ks.includes(k) && !sh.locked.has(k)); }
function runWithAnim(label, fn, ks){

  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const setLabel = t => { if (fx) { fx.querySelector('span').textContent = t; fx.hidden = false; } };
  setLabel(label);
  const list = (ks && ks.length ? ks : [0, 1, 2, 3]).slice().sort((a, b) => a - b);
  const t0 = Date.now();
  const finish = () => {
    clearInterval(spinTimer); spinTimer = null;
    S.shuffle = null; genBusy = false; if (main) main.classList.remove('shuffling');

    if (msgs.length) toast(msgs[msgs.length - 1]);

  if (!reduce) {
    S._spinNames = activePeople().filter(p => !isTemp(p)).map(p => p.name);
    S.shuffle = {date:S.date, ks:list, locked:new Set(), pop:-1};
    if (main) main.classList.add('shuffling');
    if (phone()) S.qk = list[0];
    render();
    spinTimer = setInterval(() => { document.querySelectorAll('[data-spin]').forEach(el => { el.textContent = spinName(); }); }, 75);
  }
  S.deferToasts = []; /* les messages « Rotation générée »… s'affichent à la fin du tirage */
  setTimeout(async () => {
    try { fn(); } catch (e) { console.error(e); S.deferToasts && S.deferToasts.push('Erreur pendant le calcul.'); }
    try { await Promise.allSettled(Object.values(queues)); } catch (e) {}
    if (reduce || !S.shuffle) { finish(); return; }
    /* les quarts se figent un par un sur le vrai résultat */
    const startIn = Math.max(0, SPIN_MIN_MS - (Date.now() - t0));
    list.forEach((k, i) => setTimeout(() => {

      if (phone()) S.qk = k;
      setLabel('Quart ' + (k + 1) + ' placé');
      render();

    }, startIn + i * LOCK_STEP_MS));

/* ---------- PDF : télécharger / partager (remplace l'impression, qui posait problème
   sur iPhone). Document A4 noir et blanc, une page quand c'est possible. ---------- */
const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
let pdfLoading = null;
function loadScript(src){ return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok; s.onerror = () => ko(new Error('script')); document.head.appendChild(s); }); }
const pdfReady = () => !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
function preloadPdf(){
  if (pdfReady()) return Promise.resolve();
  if (!pdfLoading) { pdfLoading = loadScript(PDF_LIBS[0]).then(() => loadScript(PDF_LIBS[1])); pdfLoading.catch(() => { pdfLoading = null; }); }

/* polices PDF standard : alphabet latin uniquement (pas d'emoji) */
const pdfTxt = s => String(s == null ? '' : s).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x20-\x7E\n -ÿŒœ]/g, '').replace(/ +/g, ' ').trim();
function pdfName(n){ return ('Planning-' + (S.cfg.team || 'equipe') + '-' + n.date).replace(/[^A-Za-z0-9._-]+/g, '-') + '.pdf'; }
function buildPdf(n){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
  const W = 210, H = 297, M = 10, Q = nq(n), ps = planPosts(n), st = nightState(n), s = (n.tl && n.tl._status) || {};
  const rows = [], zoneRows = new Set();
  let lines = 1;
  zones(ps).forEach(z => {
    zoneRows.add(rows.length); rows.push([{content:pdfTxt(z).toUpperCase(), colSpan:Q + 1}]); lines += 1;
    ps.filter(p => (p.zone || 'Autres') === z).forEach(p => {
      const row = [pdfTxt(p.code + '  ' + p.name)]; let maxL = 1;
      for (let k = 0; k < Q; k++) {
        const per = personFor(n, (n.q[k] || {})[p.id]), tr = personFor(n, (n.train[k] || {})[p.id]);
        let c = per ? per.name + (isTL(per) ? ' (TL)' : '') : 'NON COUVERT';
        if (tr) { c += '\n+ ' + tr.name + ' (F)'; maxL = 2; }
        row.push(pdfTxt(c));
      }
      lines += maxL; rows.push(row);
    });
  });
  /* pied de page : absents, absences par quart, TL */
  const foot = [];
  const absent = (n.absent || []).map(id => (personFor(n, id) || {}).name).filter(Boolean);
  if (absent.length) foot.push('Absents : ' + absent.join(', '));
  const qa = allQuarts(n).map(k => { const ids = Object.keys(n.qAbsent[k] || {}); return ids.length ? 'Q' + (k + 1) + ' : ' + ids.map(id => (personFor(n, id) || {}).name).join(', ') : ''; }).filter(Boolean);
  if (qa.length) foot.push('Absents sur un quart - ' + qa.join(' ; '));
  const offN = Object.keys(offOf(n)).filter(id => isOff(n, id) && personFor(n, id)).map(id => personFor(n, id).name + ' (' + offTxt(n, id) + ')');
  if (offN.length) foot.push('Hors ligne : ' + offN.join(', '));
  const tls = tlIds(n).map(id => { const per = S.people[id]; const a = n.tl[id] || []; const ks = allQuarts(n).filter(k => a[k]); return per && ks.length ? per.name + ' (' + ks.map(k => 'Q' + (k + 1)).join(', ') + ')' : ''; }).filter(Boolean);
  if (tls.length) foot.push('TL / renforts : ' + tls.join(' ; '));
  foot.push('(F) = en formation, toujours accompagné du titulaire.  Édité le ' + new Date().toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) + '.');
  /* taille de police la plus grande qui tient sur une page (entre 11 et 7 pt) */
  const avail = H - 2 * M - 16 - foot.length * 4.6 - 4;
  let fs = 12;
  while (fs > 7 && lines * (fs * 0.3528 * 1.18) + rows.length * 2.4 + 8 > avail) fs -= 0.5;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(pdfTxt('PLANNING ' + (S.cfg.team || '')), M, M + 6);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.text(pdfTxt(fmt(n.date) + ' - nuit' + (n.ot ? ' (avec overtime)' : '')), M, M + 12);
  doc.setFontSize(9.5);
  doc.text(pdfTxt(st === 'validated' || st === 'archived' ? 'Planning validé' + (pubBy({by:s.by, role:s.role}) ? ' par ' + pubBy({by:s.by, role:s.role}) : '') : 'BROUILLON - non validé'), W - M, M + 6, {align:'right'});
  const colW = Math.min(36, (W - 2 * M) * 0.22), qW = (W - 2 * M - colW) / Q;
  const colStyles = {0:{cellWidth:colW, fontStyle:'bold'}};
  for (let k = 1; k <= Q; k++) colStyles[k] = {cellWidth:qW};
  doc.autoTable({
    startY:M + 16, margin:{left:M, right:M, top:M, bottom:M},
    head:[['Poste'].concat(allQuarts(n).map(k => 'Quart ' + (k + 1) + (k === 4 ? ' (OT)' : '')))],
    body:rows, theme:'grid',
    styles:{font:'helvetica', fontSize:fs, textColor:0, lineColor:120, lineWidth:0.15, cellPadding:1.2, valign:'middle', overflow:'linebreak', fillColor:255},
    headStyles:{fontStyle:'bold', fillColor:255, textColor:0, lineColor:0, lineWidth:{top:0.15, bottom:0.5, left:0.15, right:0.15}},
    columnStyles:colStyles,
    didParseCell(d){
      if (d.section !== 'body') return;
      if (zoneRows.has(d.row.index)) { d.cell.styles.fontStyle = 'bold'; d.cell.styles.fontSize = Math.max(7, fs - 1.5); d.cell.styles.cellPadding = {top:1.8, bottom:0.8, left:1.2, right:1.2}; }
      else if (d.cell.raw === 'NON COUVERT') d.cell.styles.fontStyle = 'bold';
    }
  });
  let y = doc.lastAutoTable.finalY + 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
  foot.forEach(t => {
    const wrapped = doc.splitTextToSize(pdfTxt(t), W - 2 * M);
    if (y + wrapped.length * 4 > H - M) { doc.addPage(); y = M + 4; }
    doc.text(wrapped, M, y); y += wrapped.length * 4 + 0.6;
  });
  return doc.output('blob');
}
async function makePdf(date){
  const n = nightOf(date);
  if (!generated(n)) { toast('Pas de planning à exporter pour cette nuit.'); return null; }
  if (!pdfReady()) { toast('Préparation du PDF…'); try { await preloadPdf(); } catch (e) { toast('Impossible de créer le PDF : vérifie la connexion internet.'); return null; } }
  try { return {blob:buildPdf(n), name:pdfName(n)}; } catch (e) { console.error(e); toast('Erreur pendant la création du PDF.'); return null; }
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function sharePdf(pdf){
  const file = new File([pdf.blob], pdf.name, {type:'application/pdf'});
  if (navigator.canShare && navigator.share && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:pdf.name.replace(/\.pdf$/, '')}); return 'ok'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancel'; if (e && e.name === 'NotAllowedError') return 'gesture'; }
  }

}

function shPick(s){
  const p = S.posts[s.post]; if (!p) return null;
  const n = nightOf(), q = n && n.q && n.q[s.k] ? n.q[s.k] : {};
  const cur = q[p.id], where = holderMap(q), absent = new Set(n ? n.absent || [] : []);
  const curPer = cur ? S.people[cur] : null;
  const pres = activePeople().filter(per => !absent.has(per.id));
  const onQuart = per => !isTemp(per) || (n && n.tl && n.tl[per.id] && n.tl[per.id][s.k]);
  /* un échange n'est proposé que si le titulaire actuel connaît aussi l'autre poste : les 2 doivent savoir faire les 2 process */
  /* sécurité : on ne propose comme titulaire seul que des personnes habilitées seules (G), jamais quelqu'un encore en formation (H) */
  const swappable = per => { const w = where[per.id]; if (!w || w === p.id || !cur) return true; return !!(curPer && canHoldAlone(curPer, w)); };
  const othersAll = pres.filter(per => !isTL(per) && onQuart(per));
  const tls = pres.filter(per => isTL(per) && canHoldAlone(per, p.id) && !isRestricted(per, p.id, n ? n.date : S.date) && swappable(per));
  const others = othersAll.filter(per => canHoldAlone(per, p.id) && !isRestricted(per, p.id, n ? n.date : S.date) && swappable(per));
  const locked = !!(n && n.lock && n.lock[s.k] && n.lock[s.k][p.id]);
  if (s.force == null) s.force = locked;
  const Q = n ? nq(n) : 4;
  const adjRepeat = per => [s.k - 1, s.k + 1].some(kk => kk >= 0 && kk < Q && n && n.q && n.q[kk] && n.q[kk][p.id] === per.id);
  const warn = per => adjRepeat(per) ? ' <small class="muted">⚠️ déjà ce poste au quart voisin</small>' : '';
  const at = ' data-k="' + s.k + '" data-post="' + esc(p.id) + '"';
  let body = '';

  if (generated(n) && curPer) body += '<div class="opt-row"><button type="button" class="opt" data-act="removeFromQuart"' + at + '>➖ Retirer de Q' + (s.k + 1) + '</button><button type="button" class="opt" data-act="openReplace"' + at + ' data-mode="replace" data-who="' + esc(cur) + '">🔁 Remplacer</button></div>';
  else if (generated(n)) body += '<button type="button" class="opt" data-act="openReplace"' + at + ' data-mode="fill">🔎 Proposer quelqu’un automatiquement</button>';
  body += '<button type="button" class="force" data-act="force" aria-pressed="' + !!s.force + '"><span class="sw2" aria-hidden="true"></span>Forcer : garder cette personne ici à la prochaine génération</button>';
  if (locked && cur) body += '<button type="button" class="opt" data-act="unlock">Retirer le forçage (' + esc((S.people[cur] || {}).name || '') + ')</button>';
  body += '<div class="lbl">TL</div>' + (tls.length ? tls.map(per => '<button type="button" class="opt" data-act="choose" data-id="' + esc(per.id) + '"' + (cur === per.id ? ' aria-current="true"' : '') + '>' + esc(per.name) + ' <span class="tag">TL</span>' + (where[per.id] && where[per.id] !== p.id && S.posts[where[per.id]] ? '<small>sur ' + esc(S.posts[where[per.id]].code) + '</small>' : '') + warn(per) + '</button>').join('') : '<p class="note">Aucun TL habilité et présent.</p>');
  body += '<div class="lbl">Autres membres habilités</div><select class="pp-sel" data-chg="pickPerson" aria-label="Choisir une personne"><option value="">— choisir —</option>' + others.map(per => {
    const m = mark(per, p.id), tag = m === 'H' ? ' — en formation' : '';
    return '<option value="' + esc(per.id) + '"' + (cur === per.id ? ' selected' : '') + '>' + esc(per.name) + esc(tag) + (where[per.id] && where[per.id] !== p.id && S.posts[where[per.id]] ? ' (sur ' + esc(S.posts[where[per.id]].code) + ')' : '') + (adjRepeat(per) ? ' ⚠️ déjà ce poste au quart voisin' : '') + '</option>';
  }).join('') + '</select>' + (!others.length ? '<p class="note">Personne d’autre d’habilité et disponible pour un échange sur ce poste.</p>' : '');
  body += '<button type="button" class="opt" data-act="choose" data-id="">Laisser vide</button>';
  const curTrain = n && n.train && n.train[s.k] ? n.train[s.k][p.id] : null;
  body += '<button type="button" class="force" data-act="toggleFrm" aria-pressed="' + !!s.showFrm + '">🎓 Ajouter quelqu’un en formation avec ' + (cur && S.people[cur] ? esc(S.people[cur].name) : 'le titulaire') + '</button>';
  if (s.showFrm) {
    if (!cur) body += '<p class="note">Choisis d’abord qui tient le poste : la formation s’ajoute en plus de lui, pas à sa place.</p>';
    const trainable = othersAll.filter(per => mark(per, p.id) === 'H' && per.id !== cur);
    if (curTrain && S.people[curTrain]) body += '<button type="button" class="opt" data-act="unTrain" data-k="' + s.k + '" data-post="' + esc(p.id) + '">Retirer ' + esc(S.people[curTrain].name) + ' de la formation</button>';
    body += trainable.length ? trainable.map(per => '<button type="button" class="opt" data-act="chooseTrain" data-k="' + s.k + '" data-post="' + esc(p.id) + '" data-id="' + esc(per.id) + '"' + (curTrain === per.id ? ' aria-current="true"' : '') + '>' + esc(per.name) + (where[per.id] && where[per.id] !== p.id && S.posts[where[per.id]] ? '<small>sur ' + esc(S.posts[where[per.id]].code) + '</small>' : '') + '</button>').join('') : '<p class="note">Personne en formation sur ce poste (coché hachuré dans Polyvalence).</p>';
  }
  return {title:'Poste ' + esc(p.code) + ' · Quart ' + (s.k + 1), body};
}

function shRestriction(s){

/* ---------- actions ---------- */
const A = {
  reloadApp(){ location.reload(); },
  retrySave(){ retryFailed(); },
  retryLoad(){ if (!S.authUser) return; S.loadErr = false; render(); loadBusinessData(); },
  qk(d){
    const k = Number(d.k), moved = k !== S.qk; S.qk = k; render();
    /* petit effet d'entrée en cascade sur les lignes du quart choisi (pas au premier affichage) */
    if (moved) document.querySelectorAll('#main .mlist .mrow').forEach((r, i) => { if (i < 16) { r.style.animationDelay = (i * 14) + 'ms'; r.classList.add('qin'); } });
  },
  eqPick(d){ S.balPerson = d.id; render(); const sel = $('#balSel'); if (sel) sel.scrollIntoView({behavior:'smooth', block:'start'}); },
  /* changement de polyvalence : enregistré tout de suite, sans confirmation (ce n'est pas une absence) */
  setMark(d){ const src = S.people[d.per]; const post = S.posts[d.post]; const per = clone(src); per.marks = per.marks || {}; if (d.m) per.marks[d.post] = d.m; else delete per.marks[d.post]; savePerson(per); const lbl = d.m === 'G' ? 'tient le poste' : d.m === 'H' ? 'en formation' : 'ne tient plus le poste'; toast(src.name + ' — ' + (post ? post.code : d.post) + ' : ' + lbl + '.'); },
  tab(d){ if (S.genFlow) genFlag(false); S.genFlow = null; S.tab = d.tab; LS.set('tab', d.tab); close(); render(); window.scrollTo(0, 0); },
  day(d){ S.date = addDays(S.date, Number(d.d)); render(); },
  close(){ close(); },
  gen(){ A.genScope({s:'all'}); },
  genMenu(){
    if (!canEdit()) return;
    if (nightState(nightOf()) === 'validated') { toast('Planning validé : annule d’abord la validation pour pouvoir générer.'); return; }
    open({type:'genMenu'});
  },
  /* d.s : 'q1' (la veille), 'all' (toute la nuit) ou 'rest' (quarts encore vides) */
  genScope(d){
    close();
    if (!canEdit()) return;
    if (nightState(nightOf()) === 'validated') { toast('Planning validé : annule d’abord la validation pour pouvoir générer.'); return; }
    const ksFn = nn => { const m = nn || freshNight(S.date); return d.s === 'q1' ? [0] : d.s === 'rest' ? allQuarts(m).filter(k => !quartDone(m, k)) : allQuarts(m); };
    guardGen({mode:d.s === 'all' ? 'full' : d.s === 'rest' ? 'rest' : 'quart', ksFn, emptyMsg:'Tous les quarts sont déjà générés (un collègue vient peut-être de le faire).', go:ctx => { S.genCtx = Object.assign({date:S.date, scope:ksFn(nightOf())}, ctx); genFlag(true); A.genOpen(); }});
  },
  genOpen(){
    /* étape 1 : vérifier l'effectif de la nuit (onglet Effectifs), puis « Continuer » ouvre les formations */
    S.genFlow = S.date; S.tab = 'effectifs'; close(); render(); window.scrollTo(0, 0);
  },
  /* veille : on ne génère que le Q1 de la nuit suivante, puis on le valide */
  genQ1(){ A.genScope({s:'q1'}); },
  claimNo(){ close(); genFlag(false); },
  claimGo(d){
    const s = S.sheet; if (!s || s.type !== 'claim') return;
    close();
    const ctx = {sig:sigOf(nightOf()), prompted:true, dropQv:d.v === 'all'};
    s.go(ctx);
  },
  validateQ(d){
    if (!canEdit()) return;
    const k = Number(d.k), n = nightOf(); if (!quartDone(n, k)) return;
    const holes = uncoveredList(n).filter(t => t.endsWith('Q' + (k + 1)));
    if (holes.length) { askConfirm('Q' + (k + 1) + ' : ' + holes.length + ' case' + (holes.length > 1 ? 's' : '') + ' non couverte' + (holes.length > 1 ? 's' : '') + ' (' + holes.join(', ') + '). Valider quand même ?', 'validateQGo', {k}, {okLabel:'Valider quand même'}); return; }
    A.validateQGo({k});
  },
  validateQGo(d){
    if (!canEdit()) return;
    const k = Number(d.k), n = editable(); if (!quartDone(n, k)) return;
    n.tl._qv = Object.assign({}, n.tl._qv, {[k]:{id:myId(), by:myName(), role:(profile() || {}).role || '', at:new Date().toISOString()}});
    pushLog(n, 'validateQ', {date:n.date, k});
    saveNight(n); toast('Q' + (k + 1) + ' validé 🔒 · il ne sera plus recalculé sans te demander.');
  },
  unvalidateQ(d){ if (!canEdit()) return; const k = Number(d.k); askConfirm('Annuler la validation du Q' + (k + 1) + ' ? Il pourra de nouveau être modifié et recalculé par n’importe quel TL ou GL.', 'unvalidateQGo', {k}, {okLabel:'Annuler la validation', noLabel:'Garder validé'}); },
  unvalidateQGo(d){
    if (!canEdit()) return;
    const k = Number(d.k), n = editable(), v = Object.assign({}, n.tl._qv); delete v[k]; n.tl._qv = v;
    pushLog(n, 'unvalidateQ', {date:n.date, k});
    saveNight(n); toast('Q' + (k + 1) + ' rouvert.');
  },
  genContinue(){
    S.genFlow = null; S.tab = 'plan'; render(); window.scrollTo(0, 0);
    if (!canEdit()) return;
    open({type:'preGen', step:1, plan:trainingPlan(editable(), genScope())});
  },
  genCancel(){ S.genFlow = null; genFlag(false); S.tab = 'plan'; render(); },
  preGenStep(){ const s = S.sheet; if (s) { s.step = 1; renderSheet(); } },
  /* « combien en former ? » : les c premiers (conseillés d'abord) sont pré-remplis avec leurs quarts conseillés */
  pgCount(d){
    const s = S.sheet; if (!s || s.type !== 'preGen') return;
    const pl = s.plan, c = Number(d.c);
    s.sel = pl.list.map((e, i) => { const ks = i < c ? (e.rec.length ? e.rec.slice() : firstQ(pl, e.id, e.post)) : []; return {ks, off:e.off.filter(k => !ks.includes(k))}; });
    if (!c) { A.preGenGo(); return; }
    s.step = 2; renderSheet();
  },
  /* toute la nuit d'un coup : sur ligne, ou hors ligne */
  pgMode(d){
    const s = S.sheet, x = s && s.sel && s.sel[Number(d.i)]; if (!x) return;
    const inS = Array.from({length:s.plan.Q}, (z, k) => k).filter(k => s.plan.inS(k)), out = x.off.filter(k => !inS.includes(k)); /* les quarts hors de cette génération ne bougent pas */
    x.ks = []; x.off = (d.m === 'off' ? out.concat(inS) : out).sort((a, b) => a - b); renderSheet();
  },
  /* un quart : sur ligne → formation (si un titulaire est là) → hors ligne → sur ligne */
  pgQ(d){
    const s = S.sheet, x = s && s.sel && s.sel[Number(d.i)], e = s && s.plan.list[Number(d.i)]; if (!x || !e) return;
    const k = Number(d.k), sort = a => a.sort((p, q) => p - q);
    if (!s.plan.inS(k)) return;
    if (x.ks.includes(k)) { x.ks = x.ks.filter(j => j !== k); x.off = sort(x.off.concat(k)); }
    else if (x.off.includes(k)) x.off = x.off.filter(j => j !== k);
    else if (s.plan.canQ(e.id, e.post, k)) x.ks = sort(x.ks.concat(k));
    else x.off = sort(x.off.concat(k));
    renderSheet();
  },
  /* 💡 suggestion acceptée : ajoutée à la liste (passera « en formation » sur ce poste à la génération) */
  pgAddNew(d){
    const s = S.sheet; if (!s || s.type !== 'preGen') return;
    const pl = s.plan, x = pl.news.splice(Number(d.j), 1)[0]; if (!x) return;
    if (!s.sel) s.sel = pl.list.map(e => ({ks:[], off:e.off.slice()}));
    pl.list.push({id:x.id, posts:[{id:x.post, nb:x.nb}], post:x.post, held:x.held, isNew:true, rec:[], ks:[], off:[]});
    const ks = firstQ(pl, x.id, x.post);
    s.sel.push({ks, off:[]});
    s.step = 2; renderSheet();
  },
  /* génère la nuit autour des formations choisies (elles remplacent celles déjà posées) */
  preGenGo(d){
    const s = S.sheet; close(); if (!s || !canEdit()) return;
    const ctx0 = S.genCtx && S.genCtx.date === S.date ? S.genCtx : null;
    const dd = Object.assign({}, d), sc = genScope();
    guardGen({mode:sc ? 'quart' : 'full', final:true, sig:ctx0 && ctx0.sig, ksFn:n => sc || allQuarts(n || freshNight(S.date)), go:ctx => {
      S.genCtx = Object.assign({date:S.date, scope:ctx0 && ctx0.scope}, ctx.prompted || !ctx0 ? ctx : Object.assign({}, ctx0, {sig:ctx.sig}));
      A.preGenRun(s, dd);
    }});
  },
  preGenRun(s, d){
    genFlag(false);
    const ctx = S.genCtx && S.genCtx.date === S.date ? S.genCtx : {};
    const scope = genScope();
    const L = s.plan.list, sel = s.sel || L.map(e => ({ks:[], off:e.off.slice()}));
    const pick = [], off = Object.assign({}, s.plan.offKeep);
    L.forEach((e, i) => { const x = sel[i]; if (x.off.length) off[e.id] = x.off.slice(); if (x.ks.length) pick.push({id:e.id, post:e.post, ks:x.ks.slice(), isNew:e.isNew}); });
    const wasGen = generated(nightOf());
    /* 🆕 nouvelle formation acceptée : la personne passe « en formation » (hachuré) sur ce poste */
    pick.filter(x => x.isNew).forEach(x => { const src = S.people[x.id]; if (!src || mark(src, x.post)) return; const per = clone(src); per.marks = Object.assign({}, per.marks, {[x.post]:'H'}); savePerson(per); });
    runWithAnim('Calcul de la rotation…', () => {
      const n = editable(); const before = clone(n.q);
      if (Object.keys(off).length) n.tl._off = off; else delete n.tl._off;
      if (ctx.dropQv) { const v = Object.assign({}, n.tl._qv); (scope || allQuarts(n)).forEach(k => { delete v[k]; }); n.tl._qv = v; } /* « tout régénérer » : la validation est annulée */
      const keep = new Set(qvKeys(n));
      n.train = n.train.map((t, k) => (keep.has(k) || (scope && !scope.includes(k))) ? t : {});
      pick.forEach(x => x.ks.forEach(k => { if (!keep.has(k)) n.train[k][x.post] = x.id; }));
      if (scope) { scope.filter(k => !keep.has(k)).forEach(k => regenQuart(n, k)); n.generated = true; } else generateAll(n);
      let kept = 0, lost = 0;
      pick.forEach(x => x.ks.forEach(k => {
        if (keep.has(k)) return;
        if (n.train[k][x.post] !== x.id) { lost++; return; }
        kept++; const p = S.posts[x.post], tr = S.people[n.q[k][x.post]];
        pushLog(n, 'train', {date:n.date, k, postCode:p ? p.code : x.post, postName:p ? p.name : '', trainee:(S.people[x.id] || {}).name || '', trainer:tr ? tr.name : ''});
      }));
      markFresh(n, before); saveNight(n);

  absReal(d){

    const name = (S.people[d.id] || {}).name || '';

      /* planning déjà fait (validé ou non) : on ne recalcule pas toute la nuit, on comble seulement
         les trous, en changeant le moins de cases possible */
      if (nowAbsent) { const before = clone(n.q); const msgs = releasePerson(n, d.id, allQuarts(n)); markFresh(n, before); toast(name + ' absent(e)' + (msgs.length ? ' · ' + msgs.join(' · ') : '')); }

  formConfirm(){

    if (k == null) { s.err = s.mode === 'manual' ? 'Choisis un quart.' : 'Aucun quart disponible sans impacter les autres. Essaie le mode manuel.'; renderSheet(); return; }
    if (s.mode === 'manual') {
      if (!s.trainer) { s.err = 'Choisis avec qui la former.'; renderSheet(); return; }
      assignHolder(n, k, s.post, s.trainer, false);
    }
    const holder = n.q[k][s.post];

  /* génère seulement les quarts encore vides, sans toucher à ceux déjà faits ; chaque quart

  genRest(){
    if (!canEdit()) return;
    guardGen({mode:'rest', ksFn:n => allQuarts(n).filter(k => !quartDone(n, k)), emptyMsg:'Tous les quarts sont déjà générés (un collègue vient peut-être de le faire).', go:() => A.genRestRun()});
  },
  genRestRun(){
    if (!canEdit()) return;
    runWithAnim('Calcul du reste de la nuit…', () => {
      const n = editable(); const before = clone(n.q); const hist = history(n.date); const done = [];
      allQuarts(n).forEach(k => { if (!quartDone(n, k)) { n.q[k] = buildQuart(k, n, hist); n.lock[k] = {}; n.manual[k] = {}; dropOrphanTrainees(n, k); done.push('Q' + (k + 1)); } });
      if (!done.length) return;
      n.generated = true;
      stampGen(n, done.map(q => Number(q.slice(1)) - 1));
      done.forEach(q => pushLog(n, 'regenQuart', {date:n.date, k:Number(q.slice(1)) - 1}));
      markFresh(n, before); saveNight(n);
      toast(done.join(', ') + ' générés · les quarts déjà faits n’ont pas bougé.');
    }, (() => { const n = editable(); return allQuarts(n).filter(k => !quartDone(n, k)); })());

  restGo(d){

      else if (st === 'validated') { const c = editable(date); releasePerson(c, d.id, allQuarts(c), new Set(s.sel)); saveNight(c); }
