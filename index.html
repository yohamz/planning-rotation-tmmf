    --bg:#131517; --surface:#1C1F22; --surface-2:#222629; --line:#32373C; --line-2:#474D54;
    --ink:#ECEEF0; --ink-2:#B5BBC1; --muted:#868D94;
    --red:#FF3347; --red-ink:#FFFFFF; --red-soft:#3A161A;
    --mark:#A9AEB4; --tl:#262A2E;
    --vert:#4CC07C; --orange:#FFA630; --rouge:#FF5A6E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131517; --surface:#1C1F22; --surface-2:#222629; --line:#32373C; --line-2:#474D54;
  --ink:#ECEEF0; --ink-2:#B5BBC1; --muted:#868D94;
  --red:#FF3347; --red-ink:#FFFFFF; --red-soft:#3A161A;
  --mark:#A9AEB4; --tl:#262A2E;
  --vert:#4CC07C; --orange:#FFA630; --rouge:#FF5A6E;
}

[hidden]{display:none!important}
#sheet.hold{pointer-events:none}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.35;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
h1,h2{font-family:var(--f-cond);font-weight:700;margin:0;letter-spacing:.01em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-top:4px solid var(--red);border-bottom:1px solid var(--line)}

main{max-width:1280px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:14px;min-width:0}

/* la 206 CC est garée sous le logo ; un toucher la fait rouler sur toute la largeur de l'écran,
   aller puis retour (demi-tour hors champ), avant de revenir se garer sous le logo */
.brandbtn.play{overflow:visible}
.brandbtn.play .road{position:fixed;left:0;right:auto;width:100vw;top:0;z-index:5}

@keyframes drive{
  0%{left:2px;transform:scaleX(1)}
  8%{left:2px;transform:scaleX(1)}

/* ---------- engine ---------- */
function hungarian(cost){
  const n = cost.length, INF = 1e18;
  const u = new Float64Array(n + 1), v = new Float64Array(n + 1), p = new Int32Array(n + 1), way = new Int32Array(n + 1);
  for (let i = 1; i <= n; i++) {
    p[0] = i; let j0 = 0;
    const minv = new Float64Array(n + 1).fill(INF), used = new Uint8Array(n + 1);
    do {
      used[j0] = 1; const i0 = p[j0]; let delta = INF, j1 = 0;
      for (let j = 1; j <= n; j++) if (!used[j]) {
        const cur = cost[i0 - 1][j - 1] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }
      for (let j = 0; j <= n; j++) { if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta; }
      j0 = j1;
    } while (p[j0] !== 0);
    do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
  }
  const res = new Array(n).fill(-1);
  for (let j = 1; j <= n; j++) if (p[j]) res[p[j] - 1] = j - 1;
  return res;
}
/* what each person did on the previous nights: used to share posts fairly */

  past.forEach(n => (n.q || []).forEach((q, k) => Object.keys(q || {}).forEach(pid => {
    const who = q[pid]; if (!who) return;
    const w = (n.manual && n.manual[k] && n.manual[k][pid]) ? 0.4 : 1; /* une affectation faite à la main compense moins pour l’équilibre futur */
    count[who + '|' + pid] = (count[who + '|' + pid] || 0) + w;

/* affecte (ou libère) un poste à un quart ; centralise le swap avec l'ancien titulaire
   et journalise le changement — utilisé par la fiche « poste » et par « Formation ». */
function assignHolder(n, k, postId, who, force){
  const q = n.q[k], lk = n.lock[k], mn = n.manual[k];
  const old = q[postId] || null;
  if (who) {
    const where = holderMap(q)[who];
    if (where && where !== postId) { if (old) { q[where] = old; mn[where] = true; } else { delete q[where]; delete mn[where]; } if (lk[where] === who) delete lk[where]; }
    Object.keys(lk).forEach(pid => { if (pid !== postId && lk[pid] === who) delete lk[pid]; });
    q[postId] = who; mn[postId] = true;
    if (force) lk[postId] = who; else delete lk[postId];
  } else { delete q[postId]; delete lk[postId]; delete mn[postId]; }

/* mode automatique du bouton Formation : cherche un quart où le poste a déjà un
   titulaire qualifié, sans case de formation occupée, et où le stagiaire est libre —
   donc sans toucher au reste du planning. */
function autoFindQuart(n, postId, traineeId, requireFormateur){
  if ((n.absent || []).includes(traineeId)) return null;
  const Q = nq(n);
  for (let k = 0; k < Q; k++) {
    if (n.qAbsent[k] && n.qAbsent[k][traineeId]) continue;
    const holder = n.q[k] && n.q[k][postId];
    if (!holder || holder === traineeId) continue;
    const holderPer = S.people[holder]; if (!holderPer || !canHoldAlone(holderPer, postId) || isRestricted(holderPer, postId, n.date)) continue;
    if (requireFormateur && !isFormateur(holderPer)) continue;
    if (n.train[k] && n.train[k][postId]) continue;
    let busy = false;
    const qk = n.q[k] || {}; Object.keys(qk).forEach(pid => { if (qk[pid] === traineeId) busy = true; });
    if (busy) continue;
    const tk = n.train[k] || {}; Object.keys(tk).forEach(pid => { if (tk[pid] === traineeId) busy = true; });
    if (busy) continue;
    return k;

function autoFindQuartPreferTrainer(n, postId, traineeId){
  const withTrainer = autoFindQuart(n, postId, traineeId, true);

  if ((night.absent || []).includes(per.id)) return false;
  if (night.qAbsent && night.qAbsent[k] && night.qAbsent[k][per.id]) return false;
  if (isTL(per) || isTemp(per)) return !!(night.tl && night.tl[per.id] && night.tl[per.id][k]);

/* coût « équité » d'une affectation : historique des 30 dernières nuits, même poste sur

function pairCost(per, p, k, hist, others){
  let c = 15 * (hist.count[per.id + '|' + p.id] || 0);
  /* fait tourner un maximum de personnes sur la nuit (et l'overtime en particulier) plutôt
     que de réutiliser toujours les mêmes : pénalité pour qui tient déjà un autre quart ce soir */
  c += 30 * others.filter(o => o.m[per.id]).length;
  others.forEach(o => { if (o.m[per.id] === p.id) c += 600; });
  if (p.diff === 'rouge') {
    c += 6 * (hist.red[per.id] || 0);
    others.forEach(o => { if (Math.abs(o.j - k) === 1 && S.posts[o.m[per.id]] && S.posts[o.m[per.id]].diff === 'rouge') c += 150; });

/* one quart = best assignment of people to posts, given the other quarts of the night */
function buildQuart(k, night, hist){

  const fixed = {}, fixedPeople = new Set();
  const lk = (night.lock && night.lock[k]) || {};
  Object.keys(lk).forEach(pid => { const who = lk[pid]; if (S.posts[pid] && S.people[who] && !absent.has(who) && !fixedPeople.has(who)) { fixed[pid] = who; fixedPeople.add(who); } });
  const ps = posts().filter(p => !fixed[p.id]);
  /* personnes en formation sur ce quart : elles accompagnent un titulaire, on ne leur donne pas de poste */
  const trainK = (night.train && night.train[k]) || {}, trainees = new Set(Object.values(trainK));

     quelle affectation possible. Avant, EMPTY valait 5000 alors que les pénalités d'équité
     cumulées (historique + même poste aux autres quarts + postes rouges) pouvaient dépasser
     5000 : l'algorithme préférait alors laisser un poste « non couvert » alors qu'une

     cours plutôt que des personnes déjà pleinement polyvalentes — ça les laisse libres pour
     être formées (voir bouton Formation), au lieu de leur faire tenir un process au hasard
     alors qu'une personne moins chargée pourrait le faire. */
  const allPosts = posts();
  const inTraining = new Set(cands.filter(per => allPosts.some(p => mark(per, p.id) === 'H')).map(per => per.id));
  const M = [];
  for (let i = 0; i < n; i++) {
    const row = new Array(n);
    for (let j = 0; j < n; j++) {
      let c;

function freshNight(date){ return {date, ot:0, generated:false, q:[{}, {}, {}, {}, {}], lock:[{}, {}, {}, {}, {}], train:[{}, {}, {}, {}, {}], manual:[{}, {}, {}, {}, {}], qAbsent:[{}, {}, {}, {}, {}], absent:[], tl:{}}; }
function editable(date){ const n = nightOf(date); const c = n ? clone(n) : freshNight(date || S.date); c.q = [0, 1, 2, 3, 4].map(k => (c.q && c.q[k]) || {}); c.lock = [0, 1, 2, 3, 4].map(k => (c.lock && c.lock[k]) || {}); c.train = [0, 1, 2, 3, 4].map(k => (c.train && c.train[k]) || {}); c.manual = [0, 1, 2, 3, 4].map(k => (c.manual && c.manual[k]) || {}); c.qAbsent = [0, 1, 2, 3, 4].map(k => (c.qAbsent && c.qAbsent[k]) || {}); c.absent = c.absent || []; c.tl = c.tl || {}; return c; }

  night.manual = [{}, {}, {}, {}, {}]; /* une fois régénéré, l’affectation redevient « générée » pour l’équilibre futur */

/* une personne en formation (H) ne reste jamais seule : si le poste n'a plus de titulaire,

function dropOrphanTrainees(night, k){
  const t = night.train[k] || {}, q = night.q[k] || {}, placed = holderMap(q);

/* ---------- corrections locales (en cours de quart) ----------
   Retirer quelqu'un d'un quart ou le remplacer sans recalculer la nuit : on cherche les
   solutions qui changent le moins de cases (1 mouvement : une personne libre prend le
   poste ; 2 mouvements : quelqu'un du quart glisse sur le poste et une personne libre
   reprend le sien), en respectant les mêmes règles que la génération (qualifié G, pas de
   restriction, pas de formation seule, équité). Les cases forcées ne bougent jamais. */
function unseat(n, k, postId){
  const old = n.q[k][postId] || null;
  delete n.q[k][postId]; delete n.lock[k][postId]; delete n.manual[k][postId];
  if (old) { const p = S.posts[postId]; pushLog(n, 'assign', {date:n.date, k, postCode:p ? p.code : postId, postName:p ? p.name : '', from:S.people[old] ? S.people[old].name : '?', to:'vide'}); }

}
function replacementOptions(n, k, postId, banId){
  const post = S.posts[postId]; if (!post) return [];
  const q = n.q[k] || {}, lk = n.lock[k] || {}, where = holderMap(q);
  const inTraining = new Set(Object.values(n.train[k] || {}));
  const hist = history(n.date), others = otherQuarts(n, k);
  const pool = activePeople().filter(per => !inTraining.has(per.id));
  const free = pool.filter(per => onQuart(n, k, per) && !where[per.id]);
  const tlPenalty = per => isTL(per) ? 800 : 0; /* un TL ne prend un poste qu'en dernier recours */
  const opts = [], seen = new Set();
  const add = (steps, cost) => { const key = steps.map(s => s.post + ':' + s.who).join('|'); if (seen.has(key)) return; seen.add(key); opts.push({steps, cost}); };
  free.forEach(per => { if (per.id !== banId && fitFor(per, postId, n)) add([{post:postId, who:per.id}], pairCost(per, post, k, hist, others) + tlPenalty(per)); });
  pool.forEach(B => {
    const p2 = where[B.id];
    if (!p2 || p2 === postId || B.id === banId || lk[p2] === B.id || !fitFor(B, postId, n)) return;
    const post2 = S.posts[p2]; if (!post2) return;
    let best = null;
    free.forEach(C => { if (!fitFor(C, p2, n)) return; const c = pairCost(C, post2, k, hist, others) + tlPenalty(C); if (!best || c < best.c) best = {C, c}; });
    if (best) add([{post:postId, who:B.id, from:p2}, {post:p2, who:best.C.id}], pairCost(B, post, k, hist, others) + tlPenalty(B) + best.c);
  });
  /* dernier recours : un TL présent cette nuit mais pas prévu sur ce quart */
  if (!opts.length) pool.forEach(per => {
    if (!isTL(per) || per.id === banId || where[per.id] || onQuart(n, k, per)) return;
    if ((n.absent || []).includes(per.id) || (n.qAbsent[k] || {})[per.id] || !fitFor(per, postId, n)) return;
    add([{post:postId, who:per.id, tlOn:true}], 5000 + pairCost(per, post, k, hist, others));
  });

}
function applyOption(n, k, opt){
  opt.steps.forEach(s => {
    if (s.tlOn) { const a = (n.tl[s.who] || [false, false, false, false, false]).slice(); a[k] = true; n.tl[s.who] = a; }

}
/* applique automatiquement la meilleure correction (utilisé quand un planning validé

function autoFill(n, k, postId){
  const opt = replacementOptions(n, k, postId)[0];
  const p = S.posts[postId];
  if (opt) {
    applyOption(n, k, opt);
    const nm = s => (S.people[s.who] || {}).name || '?';
    const s2 = opt.steps[1];
    return 'Q' + (k + 1) + ' ' + (p ? p.code : '') + ' → ' + nm(opt.steps[0]) + (s2 ? ' (' + nm(s2) + ' reprend ' + ((S.posts[s2.post] || {}).code || '') + ')' : '');
  }
  dropOrphanTrainees(n, k);
  return 'Q' + (k + 1) + ' ' + (p ? p.code : '') + ' reste vide';
}
/* retire une personne des quarts donnés (et de ses formations) puis comble les trous ;
   onlyPosts limite aux postes concernés (restriction) */
function releasePerson(n, id, ks, onlyPosts){
  const msgs = [];
  ks.forEach(k => {
    const t = n.train[k] || {}; Object.keys(t).forEach(pid => { if (t[pid] === id && !onlyPosts) delete t[pid]; });
    const pid = holderMap(n.q[k])[id];
    if (!pid || (onlyPosts && !onlyPosts.has(pid))) return;
    unseat(n, k, pid);
    msgs.push(autoFill(n, k, pid));

}
const allQuarts = n => Array.from({length:nq(n)}, (z, k) => k);
/* pourquoi un poste est vide sur un quart : pour expliquer au lieu de masquer */
function whyEmpty(n, k, postId){
  const holders = activePeople().filter(per => canHoldAlone(per, postId));
  if (!holders.length) return 'personne n’est qualifié (G) sur ce poste';
  const where = holderMap(n.q[k] || {}), parts = [];
  const cnt = f => holders.filter(f).length;
  const abs = cnt(per => (n.absent || []).includes(per.id));
  const qabs = cnt(per => !(n.absent || []).includes(per.id) && (n.qAbsent[k] || {})[per.id]);
  const rest = cnt(per => isRestricted(per, postId, n.date));
  const off = cnt(per => (isTL(per) || isTemp(per)) && !(n.absent || []).includes(per.id) && !(n.tl[per.id] && n.tl[per.id][k]));
  const busy = cnt(per => where[per.id] && onQuart(n, k, per));
  if (abs) parts.push(abs + ' absent' + (abs > 1 ? 's' : '') + ' cette nuit');
  if (qabs) parts.push(qabs + ' absent' + (qabs > 1 ? 's' : '') + ' sur ce quart');
  if (rest) parts.push(rest + ' avec restriction');
  if (off) parts.push(off + ' TL/renfort non prévu' + (off > 1 ? 's' : '') + ' sur ce quart');
  if (busy) parts.push(busy + ' déjà placé' + (busy > 1 ? 's' : '') + ' sur un autre poste');
  return holders.length + ' qualifié' + (holders.length > 1 ? 's' : '') + (parts.length ? ' : ' + parts.join(', ') : '');

/* animation d'apparition des cases qui viennent de changer (génération, remplacement) ;

function eqData(){
  const span = S.eqSpan || 7;
  const from = addDays(S.date, -(span - 1));
  const list = Object.values(S.nights).filter(n => generated(n) && n.date >= from && n.date <= S.date);
  const count = {}, tot = {};
  list.forEach(n => (n.q || []).forEach(q => Object.keys(q || {}).forEach(pid => { const w = q[pid]; if (!w) return; count[w + '|' + pid] = (count[w + '|' + pid] || 0) + 1; tot[w] = (tot[w] || 0) + 1; })));
  return {span, list, count, tot};
}
const eqSpanBtns = (span, n, long) => '<button type="button" class="btn btn-sm' + (span === 7 ? ' btn-red' : '') + '" data-act="eqSpan" data-v="7">' + (long ? '7 derniers jours' : '7 jours') + '</button>'

function viewEquilibre(){
  if (!isAdmin()) return '<p class="muted">Accès réservé à l’administrateur.</p>';

  const pp = people().filter(per => (per.active !== false || tot[per.id]) && (!isTL(per) || tot[per.id]));
  let t = '<table class="eq"><thead><tr><th class="n" scope="col">Personne</th>' + ps.map(p => '<th scope="col" title="' + esc(p.name) + '"><span class="dot ' + esc(p.diff || '') + '"></span>' + esc(p.code) + '</th>').join('') + '<th scope="col" class="tot">Total</th></tr></thead><tbody>';
  let anyNew = false;
  pp.forEach(per => {
    const joined = joinedOf(per);
    const tenureD = joined ? Math.max(0, Math.min(span, daysBetween(joined, S.date) + 1)) : span;
    const isNew = !!(joined && tenureD < span);
    if (isNew) anyNew = true;
    t += '<tr><th class="n" scope="row" title="' + esc(per.name) + '">' + esc(per.name) + (isNew ? ' <small class="muted" title="Arrivé(e) le ' + esc(fmt(joined)) + '">🆕</small>' : '') + '</th>' + ps.map(p => { const v = count[per.id + '|' + p.id] || 0; return !canHold(per, p.id) && !v ? '<td class="no">·</td>' : '<td class="' + (v ? 'c' : 'z') + '">' + v + '</td>'; }).join('') + '<td class="c tot">' + (tot[per.id] || 0) + (isNew ? '<br><small class="muted">' + tenureD + '/' + span + ' j dans l’équipe</small>' : '') + '</td></tr>';
  });
  t += '</tbody></table>';

    + '<div class="scroll" data-scroll="eq">' + t + '</div>'

  const isNew = !!(joined && tenureD < span);
  const pctAdj = rows.length ? Math.min(100, Math.round(100 * done / Math.max(1, rows.length * (tenureD / span)))) : 0;
  let html = '<h1>Équilibre</h1>'
    + '<select class="pp-sel" id="balSel" data-chg="balPerson" aria-label="Personne">' + pp.map(x => '<option value="' + esc(x.id) + '"' + (x.id === S.balPerson ? ' selected' : '') + '>' + esc(x.name) + ' · ' + (tot[x.id] || 0) + ' quarts</option>').join('') + '</select>'
    + '<div class="bar">' + eqSpanBtns(span, list.length, false) + '</div>'
    + '<div class="eqsum"><span>Quarts<b>' + (tot[S.balPerson] || 0) + '</b></span><span>Postes faits<b>' + done + '/' + rows.length + '</b></span>' + (isNew ? '<span>Couverture ajustée<b>' + pctAdj + '%</b></span>' : '') + '</div>'
    + (isNew ? '<p class="note">🆕 Arrivé(e) le ' + esc(fmt(joined)) + ' — présent(e) ' + tenureD + ' des ' + span + ' derniers jours. La « couverture ajustée » compare ses postes faits à ce qui est attendu sur sa durée réelle dans l’équipe, pas sur toute la période.</p>' : '')
    + '<div class="mlist bal">';
  rows.forEach(p => {
    const v = count[S.balPerson + '|' + p.id] || 0;
    html += '<div class="mrow static"><span class="dot ' + esc(p.diff || '') + '"></span><span class="code">' + esc(p.code) + '</span><span class="pname">' + esc(p.name) + '</span><span class="bar-in" aria-hidden="true"><i style="width:' + Math.round(100 * v / max) + '%"></i></span><span class="cntv">' + v + '</span></div>';
  });
  if (!rows.length) html += '<div class="mrow static"><span class="muted">Aucun poste tenu.</span></div>';
  return html + '</div><p class="note">Nombre de quarts faits sur chaque poste qu’il/elle tient, sur la période. Tourne l’écran ou utilise un ordinateur pour le tableau complet.</p>';
}

/* ---------- formations proposées avant de générer ----------
   Places de formation d'un quart = personnes présentes en plus des postes (elles resteraient
   sans poste de toute façon). On propose d'abord les personnes qui tiennent le moins de
   postes, sur leur poste « en formation » le plus fragile (le moins de titulaires),
   TRAIN_MAX_Q quarts au plus chacune ; la rotation est ensuite calculée autour. Les
   formations déjà posées sur la nuit (régénération) sont reprises en premier. */
const TRAIN_MAX_Q = 2;
function trainingPlan(n){
  const Q = nq(n), allPosts = posts(), P = allPosts.length, absent = new Set(n.absent || []);
  const held = per => allPosts.filter(p => mark(per, p.id) === 'G').length;
  const present = [], places = [];
  for (let k = 0; k < Q; k++) { const c = activePeople().filter(per => onQuart(n, k, per)).length; present.push(c); places.push(Math.max(0, c - P)); }
  const left = places.slice(), used = Array.from({length:Q}, () => ({}));
  const holdersOn = (pid, k, ex) => activePeople().some(h => h.id !== ex && onQuart(n, k, h) && fitFor(h, pid, n));
  const sugg = [], seen = new Set();
  for (let k = 0; k < Q; k++) Object.keys(n.train[k] || {}).forEach(pid => {
    const id = n.train[k][pid]; if (!S.people[id] || !S.posts[pid] || !onQuart(n, k, S.people[id])) return;
    let s = sugg.find(x => x.id === id && x.post === pid);
    if (!s) { s = {id, post:pid, ks:[], held:held(S.people[id]), keep:true}; sugg.push(s); }
    s.ks.push(k); used[k][pid] = id; left[k] = Math.max(0, left[k] - 1); seen.add(id);
  });
  activePeople().filter(per => !seen.has(per.id) && !isTL(per) && !isTemp(per) && !absent.has(per.id))
    .sort((a, b) => held(a) - held(b) || a.name.localeCompare(b.name, 'fr'))
    .forEach(per => {
      const o = allPosts.filter(p => mark(per, p.id) === 'H' && !isRestricted(per, p.id, n.date)).map(p => {
        const hs = activePeople().filter(h => h.id !== per.id && !absent.has(h.id) && fitFor(h, p.id, n));
        return {p, nb:hs.length, tr:hs.some(isFormateur)};
      }).filter(x => x.nb).sort((a, b) => a.nb - b.nb || b.tr - a.tr)[0];
      if (o) sugg.push({id:per.id, post:o.p.id, nb:o.nb, ks:[], held:held(per)});
    });
  for (let r = 0; r < TRAIN_MAX_Q; r++) sugg.forEach(s => {
    if (s.keep) return;
    let best = null;
    for (let k = 0; k < Q; k++) {
      if (!left[k] || s.ks.includes(k) || used[k][s.post] || !onQuart(n, k, S.people[s.id]) || !holdersOn(s.post, k, s.id)) continue;
      const sc = left[k] + (s.ks.some(j => Math.abs(j - k) === 1) ? 100 : 0); /* quarts qui se suivent, puis le plus de places */
      if (!best || sc > best.sc) best = {k, sc};
    }
    if (best) { s.ks.push(best.k); left[best.k]--; used[best.k][s.post] = s.id; }
  });
  sugg.forEach(s => s.ks.sort((a, b) => a - b));
  /* effectif juste : ce qu'il faudrait préparer (postes peu tenus, personnes peu polyvalentes) */
  const fragile = allPosts.map(p => ({p, nb:activePeople().filter(h => !absent.has(h.id) && fitFor(h, p.id, n)).length})).filter(x => x.nb <= 2).sort((a, b) => a.nb - b.nb).slice(0, 4);
  const weak = activePeople().filter(per => !isTL(per) && !isTemp(per) && !absent.has(per.id) && held(per) <= 2).sort((a, b) => held(a) - held(b)).slice(0, 4).map(per => ({per, nb:held(per)}));
  return {present, places, total:places.reduce((a, b) => a + b, 0), P, sugg:sugg.filter(s => s.ks.length), fragile, weak};
}
const qList = ks => ks.map(k => 'Q' + (k + 1)).join(' ');
function shPreGen(s){

        + '</div>';
      if (!pl.total) body += '<p class="note">Ces conseils restent visibles : dès qu’il y aura du monde en plus, l’appli proposera qui former.</p>';

    }
    const foot = pl.sugg.length
      ? '<button type="button" class="btn" data-act="preGenGo" data-none="1">Sans formation</button><button type="button" class="btn" data-act="preGenStep" data-all="0">Choisir</button><button type="button" class="btn btn-formation" data-act="preGenStep" data-all="1">✓ Accepter tout</button>'
      : '<button type="button" class="btn" data-act="close">Annuler</button><button type="button" class="btn btn-red" data-act="preGenGo">⚡ ' + (gen ? 'Régénérer' : 'Générer le planning') + '</button>';
    return {title:'🎓 Avant de générer', body, foot};

  const usedN = pl.sugg.reduce((a, x, i) => a + (s.on[i] ? x.ks.length : 0), 0);

    + pl.sugg.map(row).join('')

  return {title:'🎓 Formations de la nuit', body, foot:'<button type="button" class="btn" data-act="preGenStep" data-back="1">‹ Retour</button><button type="button" class="btn btn-red" data-act="preGenGo">⚡ ' + (gen ? 'Régénérer' : 'Générer le planning') + '</button>'};
}
/* ---------- fiche « mettre en formation » ---------- */
function shFormation(s){
  const n = editable(); const Q = nq(n);
  const allPosts = posts();
  const heldCount = per => allPosts.filter(p => mark(per, p.id) === 'G').length;
  /* priorité aux personnes qui tiennent le moins de postes : former en premier celles qui

  const pp = activePeople().filter(per => !isTL(per) && !isTemp(per) && !(n.absent || []).includes(per.id))

      if (s.post && !postsH.some(p => p.id === s.post)) s.post = '';

            body += '<label class="field" for="fTrainer"><span>Former avec</span><select id="fTrainer" data-chg="formTrainer">' + trainerOpts + '</select></label>';

        } else {

/* ---------- cinématique « le tirage » ----------
   Pendant la génération, les noms défilent dans les cases des quarts concernés comme
   une machine à sous ; une fois le calcul ET l'enregistrement dans Supabase terminés,
   les quarts se figent un par un (Q1, Q2…) sur le vrai résultat. Durée : tout le
   chargement, avec un minimum d'environ 3 s. ks = quarts concernés. */
let genBusy = false, spinTimer = null;
const SPIN_MIN_MS = 1300, LOCK_STEP_MS = 450;
function spinName(){
  const pp = S._spinNames || [];
  return pp.length ? pp[Math.floor(Math.random() * pp.length)] : '…';
}
function spinning(k){ const sh = S.shuffle; return !!(sh && sh.date === S.date && sh.ks.includes(k) && !sh.locked.has(k)); }
function runWithAnim(label, fn, ks){
  if (genBusy) return; genBusy = true;
  const fx = $('#genfx'), main = $('#main');
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const setLabel = t => { if (fx) { fx.querySelector('span').textContent = t; fx.hidden = false; } };
  setLabel(label);
  const list = (ks && ks.length ? ks : [0, 1, 2, 3]).slice().sort((a, b) => a - b);
  const t0 = Date.now();
  const finish = () => {
    clearInterval(spinTimer); spinTimer = null;
    S.shuffle = null; genBusy = false; if (main) main.classList.remove('shuffling');
    const msgs = S.deferToasts || []; S.deferToasts = null;
    render();
    setTimeout(() => { if (fx) fx.hidden = true; }, 600);
    if (msgs.length) toast(msgs[msgs.length - 1]);
  };
  if (!reduce) {
    S._spinNames = activePeople().filter(p => !isTemp(p)).map(p => p.name);
    S.shuffle = {date:S.date, ks:list, locked:new Set(), pop:-1};
    if (main) main.classList.add('shuffling');
    if (phone()) S.qk = list[0];
    render();
    spinTimer = setInterval(() => { document.querySelectorAll('[data-spin]').forEach(el => { el.textContent = spinName(); }); }, 75);
  }
  S.deferToasts = []; /* les messages « Rotation générée »… s'affichent à la fin du tirage */
  setTimeout(async () => {
    try { fn(); } catch (e) { console.error(e); S.deferToasts && S.deferToasts.push('Erreur pendant le calcul.'); }
    try { await Promise.allSettled(Object.values(queues)); } catch (e) {}
    if (reduce || !S.shuffle) { finish(); return; }
    /* les quarts se figent un par un sur le vrai résultat */
    const startIn = Math.max(0, SPIN_MIN_MS - (Date.now() - t0));
    list.forEach((k, i) => setTimeout(() => {
      if (!S.shuffle) return;

/* ---------- PDF : télécharger / partager (remplace l'impression, qui posait problème
   sur iPhone). Document A4 noir et blanc, une page quand c'est possible. ---------- */
const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
let pdfLoading = null;
function loadScript(src){ return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok; s.onerror = () => ko(new Error('script')); document.head.appendChild(s); }); }

function preloadPdf(){
  if (pdfReady()) return Promise.resolve();

  return pdfLoading;

/* polices PDF standard : alphabet latin uniquement (pas d'emoji) */
const pdfTxt = s => String(s == null ? '' : s).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x20-\x7E\n -ÿŒœ]/g, '').replace(/ +/g, ' ').trim();

function buildPdf(n){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
  const W = 210, H = 297, M = 10, Q = nq(n), ps = planPosts(n), st = nightState(n), s = (n.tl && n.tl._status) || {};
  const rows = [], zoneRows = new Set();
  let lines = 1;
  zones(ps).forEach(z => {
    zoneRows.add(rows.length); rows.push([{content:pdfTxt(z).toUpperCase(), colSpan:Q + 1}]); lines += 1;
    ps.filter(p => (p.zone || 'Autres') === z).forEach(p => {
      const row = [pdfTxt(p.code + '  ' + p.name)]; let maxL = 1;
      for (let k = 0; k < Q; k++) {
        const per = personFor(n, (n.q[k] || {})[p.id]), tr = personFor(n, (n.train[k] || {})[p.id]);
        let c = per ? per.name + (isTL(per) ? ' (TL)' : '') : 'NON COUVERT';
        if (tr) { c += '\n+ ' + tr.name + ' (F)'; maxL = 2; }
        row.push(pdfTxt(c));
      }
      lines += maxL; rows.push(row);
    });
  });
  /* pied de page : absents, absences par quart, TL */
  const foot = [];
  const absent = (n.absent || []).map(id => (personFor(n, id) || {}).name).filter(Boolean);
  if (absent.length) foot.push('Absents : ' + absent.join(', '));
  const qa = allQuarts(n).map(k => { const ids = Object.keys(n.qAbsent[k] || {}); return ids.length ? 'Q' + (k + 1) + ' : ' + ids.map(id => (personFor(n, id) || {}).name).join(', ') : ''; }).filter(Boolean);
  if (qa.length) foot.push('Absents sur un quart - ' + qa.join(' ; '));
  const tls = tlIds(n).map(id => { const per = S.people[id]; const a = n.tl[id] || []; const ks = allQuarts(n).filter(k => a[k]); return per && ks.length ? per.name + ' (' + ks.map(k => 'Q' + (k + 1)).join(', ') + ')' : ''; }).filter(Boolean);
  if (tls.length) foot.push('TL / renforts : ' + tls.join(' ; '));
  foot.push('(F) = en formation, toujours accompagné du titulaire.  Édité le ' + new Date().toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) + '.');
  /* taille de police la plus grande qui tient sur une page (entre 11 et 7 pt) */
  const avail = H - 2 * M - 16 - foot.length * 4.6 - 4;
  let fs = 12;
  while (fs > 7 && lines * (fs * 0.3528 * 1.18) + rows.length * 2.4 + 8 > avail) fs -= 0.5;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(pdfTxt('PLANNING ' + (S.cfg.team || '')), M, M + 6);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.text(pdfTxt(fmt(n.date) + ' - nuit' + (n.ot ? ' (avec overtime)' : '')), M, M + 12);
  doc.setFontSize(9.5);
  doc.text(pdfTxt(st === 'validated' || st === 'archived' ? 'Planning validé' + (s.by ? ' par ' + s.by : '') : 'BROUILLON - non validé'), W - M, M + 6, {align:'right'});
  const colW = Math.min(36, (W - 2 * M) * 0.22), qW = (W - 2 * M - colW) / Q;
  const colStyles = {0:{cellWidth:colW, fontStyle:'bold'}};
  for (let k = 1; k <= Q; k++) colStyles[k] = {cellWidth:qW};
  doc.autoTable({
    startY:M + 16, margin:{left:M, right:M, top:M, bottom:M},
    head:[['Poste'].concat(allQuarts(n).map(k => 'Quart ' + (k + 1) + (k === 4 ? ' (OT)' : '')))],
    body:rows, theme:'grid',
    styles:{font:'helvetica', fontSize:fs, textColor:0, lineColor:120, lineWidth:0.15, cellPadding:1.2, valign:'middle', overflow:'linebreak', fillColor:255},
    headStyles:{fontStyle:'bold', fillColor:255, textColor:0, lineColor:0, lineWidth:{top:0.15, bottom:0.5, left:0.15, right:0.15}},
    columnStyles:colStyles,
    didParseCell(d){
      if (d.section !== 'body') return;
      if (zoneRows.has(d.row.index)) { d.cell.styles.fontStyle = 'bold'; d.cell.styles.fontSize = Math.max(7, fs - 1.5); d.cell.styles.cellPadding = {top:1.8, bottom:0.8, left:1.2, right:1.2}; }
      else if (d.cell.raw === 'NON COUVERT') d.cell.styles.fontStyle = 'bold';
    }
  });
  let y = doc.lastAutoTable.finalY + 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
  foot.forEach(t => {
    const wrapped = doc.splitTextToSize(pdfTxt(t), W - 2 * M);
    if (y + wrapped.length * 4 > H - M) { doc.addPage(); y = M + 4; }
    doc.text(wrapped, M, y); y += wrapped.length * 4 + 0.6;
  });
  return doc.output('blob');
}
async function makePdf(date){
  const n = nightOf(date);

  if (!pdfReady()) { toast('Préparation du PDF…'); try { await preloadPdf(); } catch (e) { toast('Impossible de créer le PDF : vérifie la connexion internet.'); return null; } }
  try { return {blob:buildPdf(n), name:pdfName(n)}; } catch (e) { console.error(e); toast('Erreur pendant la création du PDF.'); return null; }
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function sharePdf(pdf){

  /* un échange n'est proposé que si le titulaire actuel connaît aussi l'autre poste : les 2 doivent savoir faire les 2 process */

  const swappable = per => { const w = where[per.id]; if (!w || w === p.id || !cur) return true; return !!(curPer && canHoldAlone(curPer, w)); };
  const othersAll = pres.filter(per => !isTL(per) && onQuart(per));
  const tls = pres.filter(per => isTL(per) && canHoldAlone(per, p.id) && !isRestricted(per, p.id, n ? n.date : S.date) && swappable(per));
  const others = othersAll.filter(per => canHoldAlone(per, p.id) && !isRestricted(per, p.id, n ? n.date : S.date) && swappable(per));
  const locked = !!(n && n.lock && n.lock[s.k] && n.lock[s.k][p.id]);
  if (s.force == null) s.force = locked;
  const Q = n ? nq(n) : 4;

  const warn = per => adjRepeat(per) ? ' <small class="muted">⚠️ déjà ce poste au quart voisin</small>' : '';

  else if (generated(n)) body += '<button type="button" class="opt" data-act="openReplace"' + at + ' data-mode="fill">🔎 Proposer quelqu’un automatiquement</button>';
  body += '<button type="button" class="force" data-act="force" aria-pressed="' + !!s.force + '"><span class="sw2" aria-hidden="true"></span>Forcer : garder cette personne ici à la prochaine génération</button>';
  if (locked && cur) body += '<button type="button" class="opt" data-act="unlock">Retirer le forçage (' + esc((S.people[cur] || {}).name || '') + ')</button>';
  body += '<div class="lbl">TL</div>' + (tls.length ? tls.map(per => '<button type="button" class="opt" data-act="choose" data-id="' + esc(per.id) + '"' + (cur === per.id ? ' aria-current="true"' : '') + '>' + esc(per.name) + ' <span class="tag">TL</span>' + (where[per.id] && where[per.id] !== p.id && S.posts[where[per.id]] ? '<small>sur ' + esc(S.posts[where[per.id]].code) + '</small>' : '') + warn(per) + '</button>').join('') : '<p class="note">Aucun TL habilité et présent.</p>');
  body += '<div class="lbl">Autres membres habilités</div><select class="pp-sel" data-chg="pickPerson" aria-label="Choisir une personne"><option value="">— choisir —</option>' + others.map(per => {
    const m = mark(per, p.id), tag = m === 'H' ? ' — en formation' : '';
    return '<option value="' + esc(per.id) + '"' + (cur === per.id ? ' selected' : '') + '>' + esc(per.name) + esc(tag) + (where[per.id] && where[per.id] !== p.id && S.posts[where[per.id]] ? ' (sur ' + esc(S.posts[where[per.id]].code) + ')' : '') + (adjRepeat(per) ? ' ⚠️ déjà ce poste au quart voisin' : '') + '</option>';
  }).join('') + '</select>' + (!others.length ? '<p class="note">Personne d’autre d’habilité et disponible pour un échange sur ce poste.</p>' : '');
  body += '<button type="button" class="opt" data-act="choose" data-id="">Laisser vide</button>';
  const curTrain = n && n.train && n.train[s.k] ? n.train[s.k][p.id] : null;
  body += '<button type="button" class="force" data-act="toggleFrm" aria-pressed="' + !!s.showFrm + '">🎓 Ajouter quelqu’un en formation avec ' + (cur && S.people[cur] ? esc(S.people[cur].name) : 'le titulaire') + '</button>';
  if (s.showFrm) {
    if (!cur) body += '<p class="note">Choisis d’abord qui tient le poste : la formation s’ajoute en plus de lui, pas à sa place.</p>';
    const trainable = othersAll.filter(per => mark(per, p.id) === 'H' && per.id !== cur);

    body += trainable.length ? trainable.map(per => '<button type="button" class="opt" data-act="chooseTrain" data-k="' + s.k + '" data-post="' + esc(p.id) + '" data-id="' + esc(per.id) + '"' + (curTrain === per.id ? ' aria-current="true"' : '') + '>' + esc(per.name) + (where[per.id] && where[per.id] !== p.id && S.posts[where[per.id]] ? '<small>sur ' + esc(S.posts[where[per.id]].code) + '</small>' : '') + '</button>').join('') : '<p class="note">Personne en formation sur ce poste (coché hachuré dans Polyvalence).</p>';
  }
  return {title:'Poste ' + esc(p.code) + ' · Quart ' + (s.k + 1), body};
}

function loginGroups(rows){
  const btn = a => '<button type="button" class="namebtn" data-act="pickAccount" data-id="' + esc(a.id) + '">' + esc(a.name) + '</button>';
  return ['tl', 'gl', 'tm'].map(r => rows.filter(a => a.role === r)).filter(g => g.length).map(g => g.map(btn).join('')).join('<div class="sep" aria-hidden="true"></div>');
}
function viewLogin(){
  const rows = Object.values(S.profiles).filter(a => a.active !== false && a.role !== 'admin').sort((x, y) => x.name.localeCompare(y.name, 'fr'));
  if (!S.loginPick) {
    return '<div class="authwrap"><div class="authcard"><div class="authhead"><button type="button" class="brandbtn" data-act="playRoad" aria-label="ROTATEAM — touche pour voir l’animation"><div class="road" aria-hidden="true">' + roadHtml() + '</div><div class="brand"><img class="brandicon" src="icones/icon-256.png?v=3" alt="">ROTA<span class="wmteam">TEAM</span> <span>' + esc(S.cfg.team || 'CH2-2') + '</span><span class="verbadge">V0.1 test</span></div></button><button type="button" class="gearbtn" data-act="toggleAdminMenu" aria-label="Réglages">⚙</button></div>'
      + (S.loginErr ? '<p class="note" style="color:var(--red)">' + esc(S.loginErr) + '</p>' : '')
      + '<p class="note">Touche ton nom pour te connecter.</p><div class="namegrid">'
      + (rows.length ? loginGroups(rows) : '<p class="note">Chargement des comptes…</p>')
      + '</div>'
      + (S.showAdminMenu ? '<div class="authcard" style="margin-top:14px;padding:14px"><p class="note" style="margin:0 0 8px">Accès administrateur</p><label class="field" for="loAdminEmail"><span>Email</span><input type="email" id="loAdminEmail" data-chg="adminEmail" autocomplete="off" value="' + esc(S.adminEmail || '') + '"></label><label class="field" for="loAdminPass"><span>Mot de passe</span><input type="password" id="loAdminPass" data-chg="loginPass" autocomplete="current-password" value="' + esc(S.loginPass || '') + '"></label><button type="button" class="btn btn-red" data-act="doAdminLogin"' + (S.loginBusy ? ' disabled' : '') + '>' + (S.loginBusy ? 'Connexion…' : 'Se connecter') + '</button></div>' : '')
      + '</div></div>';
  }
  const acc = S.profiles[S.loginPick];
  const pickTitle = acc && acc.role === 'admin' ? 'Admin' : (acc ? acc.name : '');
  return '<div class="authwrap"><div class="authcard"><div class="authhead"><button type="button" class="brandbtn" data-act="playRoad" aria-label="ROTATEAM — touche pour voir l’animation"><div class="road" aria-hidden="true">' + roadHtml() + '</div><div class="brand"><img class="brandicon" src="icones/icon-256.png?v=3" alt="">ROTA<span class="wmteam">TEAM</span> <span>' + esc(S.cfg.team || 'CH2-2') + '</span><span class="verbadge">V0.1 test</span></div></button></div><h1>' + esc(pickTitle) + '</h1>'
    + '<label class="field" for="loPass"><span>Mot de passe</span><input type="password" id="loPass" data-chg="loginPass" autocomplete="current-password" value="' + esc(S.loginPass || '') + '"></label>'
    + (S.loginErr ? '<p class="note" style="color:var(--red)">' + esc(S.loginErr) + '</p>' : '')
    + '<div class="bar">' + (S.loginBusy ? '<span class="muted">Connexion…</span>' : '<button type="button" class="btn" data-act="loginBack">‹ Retour</button><button type="button" class="btn btn-red grow" data-act="doLogin">Se connecter</button>') + '</div></div></div>';
}
function viewChangePass(){
  const p = profile();
  return '<div class="authwrap"><div class="authcard"><h1>Choisis ton mot de passe</h1><p class="note">' + esc(p ? p.name : '') + ', c’est ta première connexion (ou ton mot de passe vient d’être réinitialisé). Choisis un mot de passe personnel, 6 caractères minimum.</p>'
    + '<label class="field" for="npPass"><span>Nouveau mot de passe</span><input type="password" id="npPass" data-chg="newPass" value="' + esc(S.newPass) + '" autocomplete="off"></label>'
    + '<label class="field" for="npPass2"><span>Confirmer</span><input type="password" id="npPass2" data-chg="newPass2" value="' + esc(S.newPass2) + '" autocomplete="off"></label>'
    + (S.newPassErr ? '<p class="note" style="color:var(--red)">' + esc(S.newPassErr) + '</p>' : '')
    + '<button type="button" class="btn btn-red" data-act="doChangePass"' + (S.newPassBusy ? ' disabled' : '') + '>' + (S.newPassBusy ? 'Enregistrement…' : 'Valider') + '</button></div></div>';
}
/* écran hors horaires (7h30-21h, uniquement pour le rôle TM) : « Maintenance en cours » avec la 206 CC qui roule */
function viewClosed(){
  return '<div class="authwrap"><div class="authcard maint"><div class="maint-road" aria-hidden="true"><div class="maint-car">' + car206() + '</div></div>'
    + '<h1>Maintenance en cours</h1><p class="note">' + greeting() + (profile() ? ' ' + esc(profile().name) : '') + ', l’appli est accessible de 21h à 7h30. Reviens ce soir !</p>'
    + '<button type="button" class="btn" data-act="logout">Se déconnecter</button></div></div>';

function shRegen(){ return {title:'Régénérer la nuit ?', body:'<p style="margin:0">Le planning de cette nuit sera recalculé. Les personnes forcées restent à leur place, les autres corrections à la main sont remplacées.</p>', foot:'<button type="button" class="btn" data-act="close">Annuler</button><button type="button" class="btn btn-red" data-act="genGo">Régénérer</button>'}; }
function shPost(s){
  const p = S.posts[s.id]; if (!p) return null; s.form = true;
  const body = '<label class="field" for="fCode"><span>Code</span><input type="text" id="fCode" data-chg="poCode" value="' + esc(p.code) + '"></label>'
    + '<label class="field" for="fPName"><span>Nom</span><input type="text" id="fPName" data-chg="poName" value="' + esc(p.name) + '"></label>'
    + '<label class="field" for="fZone"><span>Team</span><input type="text" id="fZone" data-chg="poZone" value="' + esc(p.zone || '') + '"></label>';
  const foot = s.del ? '<button type="button" class="btn" data-act="delNo">Annuler</button><button type="button" class="btn btn-red" data-act="delPost">Confirmer la suppression</button>' : '<button type="button" class="btn" data-act="delAsk" style="margin-right:auto">Supprimer</button><button type="button" class="btn btn-red" data-act="close">Terminé</button>';
  return {title:'Poste · ' + esc(p.code) + (p.name ? ' · ' + esc(p.name) : ''), body, foot};
}

/* ---------- actions ---------- */
const A = {
  reloadApp(){ location.reload(); },
  retrySave(){ retryFailed(); },
  qk(d){ S.qk = Number(d.k); render(); },
  /* changement de polyvalence : enregistré tout de suite, sans confirmation (ce n'est pas une absence) */
  setMark(d){ const src = S.people[d.per]; const post = S.posts[d.post]; const per = clone(src); per.marks = per.marks || {}; if (d.m) per.marks[d.post] = d.m; else delete per.marks[d.post]; savePerson(per); const lbl = d.m === 'G' ? 'tient le poste' : d.m === 'H' ? 'en formation' : 'ne tient plus le poste'; toast(src.name + ' — ' + (post ? post.code : d.post) + ' : ' + lbl + '.'); },
  tab(d){ S.genFlow = null; S.tab = d.tab; LS.set('tab', d.tab); close(); render(); window.scrollTo(0, 0); },
  day(d){ S.date = addDays(S.date, Number(d.d)); render(); },
  close(){ close(); },
  gen(){
    if (!canEdit()) return;
    const cur = nightOf();
    if (nightState(cur) === 'validated') { toast('Planning validé : repasse-le en préparation pour tout régénérer, ou génère un seul quart (appui long sur Q1, Q2…).'); return; }
    /* étape 1 : vérifier l'effectif de la nuit (onglet Effectifs), puis « Continuer » ouvre les formations */
    S.genFlow = S.date; S.tab = 'effectifs'; close(); render(); window.scrollTo(0, 0);
  },
  genContinue(){
    S.genFlow = null; S.tab = 'plan'; render(); window.scrollTo(0, 0);
    if (!canEdit()) return;
    open({type:'preGen', step:1, plan:trainingPlan(editable()), on:[]});
  },
  genCancel(){ S.genFlow = null; S.tab = 'plan'; render(); },
  preGenStep(d){
    const s = S.sheet; if (!s) return;
    if (d.back) s.step = 1; else { s.step = 2; s.on = s.plan.sugg.map(() => d.all === '1'); }
    renderSheet();
  },
  preGenToggle(d){ const s = S.sheet; s.on[Number(d.i)] = !s.on[Number(d.i)]; renderSheet(); },
  /* génère la nuit autour des formations choisies (elles remplacent celles déjà posées) */
  preGenGo(d){
    const s = S.sheet; close(); if (!s || !canEdit()) return;
    const pick = d.none ? [] : s.plan.sugg.filter((x, i) => s.step === 2 && s.on[i]);
    const wasGen = generated(nightOf());
    runWithAnim('Calcul de la rotation…', () => {
      const n = editable(); const before = clone(n.q);
      n.train = [{}, {}, {}, {}, {}];
      pick.forEach(x => x.ks.forEach(k => { n.train[k][x.post] = x.id; }));
      generateAll(n);
      let kept = 0, lost = 0;
      pick.forEach(x => x.ks.forEach(k => {
        if (n.train[k][x.post] !== x.id) { lost++; return; }
        kept++; const p = S.posts[x.post], tr = S.people[n.q[k][x.post]];
        pushLog(n, 'train', {date:n.date, k, postCode:p ? p.code : x.post, postName:p ? p.name : '', trainee:(S.people[x.id] || {}).name || '', trainer:tr ? tr.name : ''});
      }));
      markFresh(n, before); saveNight(n);
      toast((wasGen ? 'Rotation recalculée' : 'Rotation générée') + (kept ? ' · ' + kept + ' quart' + (kept > 1 ? 's' : '') + ' de formation' : '') + (lost ? ' · ' + lost + ' retiré' + (lost > 1 ? 's' : '') + ' (pas de titulaire)' : ''));
    }, allQuarts(editable()));
  },
  genGo(){
    close(); if (!canEdit()) return;
    runWithAnim('Calcul de la rotation…', () => { const n = editable(); const before = clone(n.q); generateAll(n); markFresh(n, before); saveNight(n); toast('Rotation recalculée'); }, allQuarts(editable()));
  },
  pick(d){ if (!canEdit()) return; if (S.sheet && S.sheet.type === 'replace') S.sheet.done = true; open({type:'pick', k:Number(d.k), post:d.post}); },
  trainees(d){ open({type:'trainees', id:d.id}); },
  toggleFrm(){ S.sheet.showFrm = !S.sheet.showFrm; renderSheet(); },
  choose(d){
    if (!canEdit()) return;
    const s = S.sheet, n = editable();
    assignHolder(n, s.k, s.post, d.id || null, s.force);
    dropOrphanTrainees(n, s.k);
    close(); saveNight(n);
  },
  addRenfort(){
    const cnt = Object.values(S.people).filter(p => isTemp(p) && p.active !== false).length + 1;
    const id = newId('re');
    savePerson({id, name:'Renfort ' + cnt, role:'TM', temp:true, order:9000 + cnt, marks:{}});
    renderSheet();
    const row = document.querySelector('[data-renfort="' + id + '"]'); if (row) row.classList.add('fresh');
    toast('💪🏼 Renfort ' + cnt + ' ajouté : coche ses quarts, puis « Postes ».');
  },
  delRenfort(d){
    A.delRenfortReal(d); /* sans confirmation */
  },
  delRenfortReal(d){
    /* désactivé plutôt que supprimé : un TL a le droit d'enregistrer une personne mais pas d'en supprimer une */
    const per = S.people[d.id]; if (!per) return;
    savePerson(Object.assign(clone(per), {active:false}));
    renderSheet();
  },
  force(){ S.sheet.force = !S.sheet.force; renderSheet(); },
  unlock(){ if (!canEdit()) return; const s = S.sheet, n = editable(); delete n.lock[s.k][s.post]; close(); saveNight(n); },
  chooseTrain(d){ if (!canEdit()) return; const n = editable(); const k = Number(d.k); const post = S.posts[d.post]; const trainerId = n.q[k] ? n.q[k][d.post] : null; n.train[k][d.post] = d.id; pushLog(n, 'train', {date:n.date, k, postCode:post ? post.code : d.post, postName:post ? post.name : '', trainee:(S.people[d.id] || {}).name || '', trainer:(trainerId && S.people[trainerId]) ? S.people[trainerId].name : ''}); saveNight(n); renderSheet(); },
  unTrain(d){ if (!canEdit()) return; const n = editable(); const k = Number(d.k); const post = S.posts[d.post]; const prevId = n.train[k][d.post]; delete n.train[k][d.post]; if (prevId && S.people[prevId]) pushLog(n, 'untrain', {date:n.date, k, postCode:post ? post.code : d.post, postName:post ? post.name : '', trainee:S.people[prevId].name}); saveNight(n); renderSheet(); },
  abs(d){
    if (!canEdit()) return;
    const n = editable(); const off = (n.absent || []).includes(d.id);
    if (off) { A.absReal(d); return; } /* remettre présent : correction immédiate, sans confirmation */
    const per = S.people[d.id];
    if (nightState(n) !== 'validated') { A.absReal(d); return; } /* pas de confirmation, sauf planning validé */
    const extra = nightState(n) === 'validated' ? ' Le planning validé sera corrigé localement (remplaçant automatique).' : '';
    askConfirm((per ? per.name : '') + ' — marquer absent(e) cette nuit ?' + extra, 'absReal', d);
  },
  absReal(d){
    if (!canEdit()) return;
    const n = editable(); const set = new Set(n.absent);
    const nowAbsent = !set.has(d.id);
    if (nowAbsent) set.add(d.id); else set.delete(d.id);
    n.absent = [...set];
    const name = (S.people[d.id] || {}).name || '';
    if (nightState(n) === 'validated') {
      /* planning officiel : on ne recalcule pas toute la nuit, on comble seulement les trous */
      if (nowAbsent) { const before = clone(n.q); const msgs = releasePerson(n, d.id, allQuarts(n)); markFresh(n, before); if (msgs.length) toast(name + ' absent(e) · ' + msgs.join(' · ')); }
      else toast(name + ' de nouveau disponible (le planning validé n’est pas modifié).');
    } else {
      n.train = n.train.map(m => { const c = Object.assign({}, m); Object.keys(c).forEach(pid => { if (c[pid] === d.id) delete c[pid]; }); return c; });
      if (n.generated) generateAll(n);
    }
    saveNight(n); renderSheet();
  },
  tlq(d){
    if (!canEdit()) return;
    const n = editable(); const k = Number(d.k);
    const a = (n.tl[d.id] || [false, false, false, false, false]).slice(); a[k] = !a[k]; n.tl[d.id] = a;
    if (nightState(n) === 'validated') { if (!a[k]) { const msgs = releasePerson(n, d.id, [k]); if (msgs.length) toast(msgs.join(' · ')); } }
    else if (n.generated) regenQuart(n, k);
    saveNight(n); renderSheet();
  },
  /* overtime = un quart à part : son propre bouton de génération (comme « Générer » pour les
     quarts 1-4), qui tient compte de ce qui a déjà été réparti ce soir et de l'historique
     pour rester équitable, plutôt que de simplement rajouter une case vide. */
  otOn(){
    if (!canEdit()) return;
    const cur = nightOf();
    if (!generated(cur)) { const n = editable(); n.ot = 1; saveNight(n); toast('Overtime ajouté : sera réparti à la génération de la nuit.'); return; }
    runWithAnim('Calcul de l’overtime…', () => { const n = editable(); n.ot = 1; const before = clone(n.q); regenQuart(n, 4); markFresh(n, before); saveNight(n); toast('Overtime généré, Quart 5 — réparti équitablement avec le reste de la nuit.'); }, [4]);
  },
  otOff(){ if (!canEdit()) return; const n = editable(); n.ot = 0; n.q[4] = {}; n.lock[4] = {}; n.train[4] = {}; saveNight(n); },
  eqSpan(d){ S.eqSpan = Number(d.v); render(); },
  formation(){ if (!canEdit()) return; open({type:'formation', mode:'auto', done:[]}); },
  formMode(d){ S.sheet.mode = d.v; S.sheet.k = null; S.sheet.trainer = ''; S.sheet.err = ''; renderSheet(); },
  formK(d){ S.sheet.k = Number(d.k); S.sheet.trainer = ''; renderSheet(); },
  formConfirm(){
    if (!canEdit()) return;
    const s = S.sheet;
    if (!s.trainee || !s.post) { s.err = 'Choisis une personne et un poste.'; renderSheet(); return; }
    const n = editable();
    let k = s.mode === 'manual' ? s.k : autoFindQuartPreferTrainer(n, s.post, s.trainee);
    if (k == null) { s.err = s.mode === 'manual' ? 'Choisis un quart.' : 'Aucun quart disponible sans impacter les autres. Essaie le mode manuel.'; renderSheet(); return; }
    if (s.mode === 'manual') {
      if (!s.trainer) { s.err = 'Choisis avec qui la former.'; renderSheet(); return; }
      assignHolder(n, k, s.post, s.trainer, false);
    }
    const holder = n.q[k][s.post];
    if (!holder) { s.err = 'Il faut un titulaire qualifié sur ce poste à ce quart.'; renderSheet(); return; }
    n.train[k][s.post] = s.trainee;
    const traineeName = (S.people[s.trainee] || {}).name || '';
    const postObj = S.posts[s.post];
    const holderName = (S.people[holder] || {}).name || '';
    pushLog(n, 'train', {date:n.date, k, postCode:postObj ? postObj.code : s.post, postName:postObj ? postObj.name : '', trainee:traineeName, trainer:holderName});
    saveNight(n);
    s.done = s.done || []; s.done.unshift(traineeName + ' — ' + (postObj ? postObj.code : '') + ' · Quart ' + (k + 1) + ' avec ' + holderName);
    s.post = ''; s.k = null; s.trainer = ''; s.err = '';
    renderSheet();
    toast(traineeName + ' mis(e) en formation.');
  },
  /* ---- cycle de vie : valider / repasser en préparation ---- */
  validate(){
    if (!canEdit()) return;
    const n = nightOf(); if (!generated(n)) return;
    const cov = coverage(n), todo = allQuarts(n).filter(k => !quartDone(n, k));
    askConfirm('Valider le planning de la nuit du ' + fmt(n.date) + ' ? ' + (nightEnded(n.date) ? 'Cette nuit est terminée : il passera directement dans les Archives, en lecture seule.' : 'Il devient le planning officiel et passera dans les Archives à la fin de la nuit.') + (cov.missing ? ' Attention : ' + cov.missing + ' case(s) non couverte(s).' : '') + (todo.length ? ' Attention : ' + todo.map(k => 'Q' + (k + 1)).join(', ') + ' pas encore généré(s).' : ''), 'validateReal', null, {okLabel:'✓ Valider'});
  },
  validateReal(){
    if (!canEdit()) return;
    const n = editable(); if (!generated(n)) return;
    const p = profile();
    n.tl._status = {state:'validated', at:new Date().toISOString(), by:(p && p.name) || ''};
    n.tl._snap = snapshot(n);
    pushLog(n, 'validate', {date:n.date});
    if (S.sheet && S.sheet.type === 'suggest') close();
    saveNight(n); toast('Planning validé : c’est le planning officiel.');
  },
  unvalidate(){ if (!canEdit()) return; askConfirm('Repasser ce planning en préparation ? Il ne sera plus le planning officiel tant qu’il n’est pas revalidé, et ne sera pas archivé.', 'unvalidateReal', null); },
  unvalidateReal(){ if (!canEdit()) return; const n = editable(); delete n.tl._status; delete n.tl._snap; pushLog(n, 'unvalidate', {date:n.date}); saveNight(n); toast('Planning repassé en préparation.'); },
  /* ---- suggestions, menus, remplacements ---- */
  suggest(){ if (isAdmin() || isViewer()) return; open({type:'suggest', form:true}); },
  async sendFeedback(){
    const s = S.sheet; if (!s || s.type !== 'suggest' || s.fbBusy) return;
    const msg = String(s.fbText || '').trim();
    if (!msg) { s.fbOk = false; s.fbMsg = 'Écris ta suggestion avant d’envoyer.'; renderSheet(); return; }
    s.fbBusy = true; s.fbMsg = ''; renderSheet();
    const {error} = await sb.from('feedback').insert({message:msg});
    s.fbBusy = false;
    if (error) { s.fbOk = false; s.fbMsg = 'Envoi impossible, réessaie.'; }
    else { s.fbOk = true; s.fbText = ''; s.fbMsg = 'Merci ! Ta suggestion a été envoyée à l’Admin.'; }
    if (S.sheet === s) renderSheet();
  },
  messages(){ if (!isAdmin()) return; open({type:'messages'}); },
  fbRead(d){ const f = S.feedback[d.id]; if (!f || !isAdmin()) return; f.read = true; render(); renderSheet(); queued('fb:' + f.id, () => sb.from('feedback').update({read:true}).eq('id', f.id)); },
  fbReadAll(){ if (!isAdmin()) return; Object.values(S.feedback).filter(f => !f.read).forEach(f => A.fbRead({id:f.id})); },
  fbDelete(d){ const f = S.feedback[d.id]; if (!f) return; askConfirm('Supprimer le message de ' + (f.author_name || '?') + ' ?', 'fbDeleteReal', d, {danger:true, okLabel:'Supprimer'}); },
  fbDeleteReal(d){ if (!isAdmin() || !S.feedback[d.id]) return; delete S.feedback[d.id]; render(); queued('fb:' + d.id, () => sb.from('feedback').delete().eq('id', d.id)); },
  cellMenu(d){ if (!canEdit()) return; open({type:'cellMenu', k:Number(d.k), post:d.post}); },
  quartMenu(d){ if (!canEdit()) return; open({type:'quartMenu', k:Number(d.k)}); },
  openReplace(d){ if (!canEdit()) return; open({type:'replace', k:Number(d.k), post:d.post, mode:d.mode || 'fill', who:d.who || null}); },
  removeFromQuart(d){
    if (!canEdit()) return;
    const k = Number(d.k), n = nightOf(), who = n && n.q[k] && n.q[k][d.post];
    if (!who) return;
    askConfirm('Retirer ' + ((S.people[who] || {}).name || '') + ' du quart ' + (k + 1) + ' ? Il/elle reste disponible pour les autres quarts.', 'removeReal', {k, post:d.post, who}, {okLabel:'Retirer du Q' + (k + 1)});
  },
  removeReal(d){
    if (!canEdit()) return;
    const k = Number(d.k), n = editable();
    if (n.q[k][d.post] !== d.who) { toast('Le planning a changé entre-temps, rien n’a été modifié.'); return; }
    unseat(n, k, d.post);
    n.qAbsent[k] = Object.assign({}, n.qAbsent[k]); n.qAbsent[k][d.who] = true; /* ne sera pas replacé sur ce quart */
    const t = n.train[k]; Object.keys(t).forEach(pid => { if (t[pid] === d.who) delete t[pid]; });
    pushLog(n, 'remove', {date:n.date, k, person:(S.people[d.who] || {}).name || ''});
    saveNight(n);
    open({type:'replace', k, post:d.post, mode:'remove', who:d.who});
  },
  replApply(d){
    if (!canEdit()) return;
    const s = S.sheet; const o = s && s.opts && s.opts[Number(d.i)]; if (!o) return;
    const n = editable(); const before = clone(n.q);
    if (s.mode === 'replace') {
      if (n.q[s.k][s.post] !== s.who) { toast('Le planning a changé entre-temps, rien n’a été modifié.'); s.done = true; close(); return; }
      unseat(n, s.k, s.post);
    }
    applyOption(n, s.k, o); dropOrphanTrainees(n, s.k);
    markFresh(n, before);
    s.done = true; close(); saveNight(n);
    toast('Remplacement appliqué · ' + o.steps.length + ' changement' + (o.steps.length > 1 ? 's' : '') + '.');
  },
  replLeave(){
    const s = S.sheet; s.done = true; close();
    const n = nightOf(); const t = n && n.train[s.k];
    if (t && t[s.post] && !(n.q[s.k] || {})[s.post]) { const c = editable(); dropOrphanTrainees(c, s.k); saveNight(c); toast('Poste laissé vide · la formation sur ce poste est retirée.'); }

  /* génère seulement les quarts encore vides, sans toucher à ceux déjà faits ; chaque quart

  if (e.button > 0) return;
  const el = e.target.closest('[data-long]'); cancelPress(); if (!el) return;
  press = {el, x:e.clientX, y:e.clientY, id:e.pointerId, armed:false, timer:setTimeout(armLong, LONG_MS)};
});
document.addEventListener('pointermove', e => {
  if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > (press.armed ? LONG_TOL_ARMED : LONG_TOL)) cancelPress();
});
document.addEventListener('pointerup', e => {
  if (!press || e.pointerId !== press.id) return;
  const p = press; cancelPress();
  if (p.armed) fireLong(p.el);
});
/* le navigateur peut annuler le pointeur pendant un appui long (pointercancel) : on attend alors
   la fin réelle du toucher (touchend) pour ouvrir, jamais pendant que le doigt est posé */
document.addEventListener('pointercancel', e => {
  if (!press || e.pointerId !== press.id) return;
  const p = press; cancelPress();
  if (!p.armed) return;
  p.el.classList.add('longarmed'); longUntil = Date.now() + 5000;
  let t = null;
  const fin = ev => { document.removeEventListener('touchend', fin, true); document.removeEventListener('touchcancel', fin, true); clearTimeout(t); p.el.classList.remove('longarmed'); if (ev && ev.type === 'touchend') fireLong(p.el); };
  document.addEventListener('touchend', fin, true); document.addEventListener('touchcancel', fin, true);
  t = setTimeout(fin, 5000);
});
document.addEventListener('contextmenu', e => {
  /* appui long au doigt : Android envoie aussi contextmenu pendant que le doigt est posé → on
     bloque seulement son menu, l'action partira au relâchement */
  if (press || holdTimer || Date.now() < longUntil) { e.preventDefault(); if (press && !press.armed) armLong(); return; }
  const el = e.target.closest('[data-long]'); if (!el) return;
  e.preventDefault();
  fireLong(el); /* clic droit à la souris : tout de suite */
});
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
  if (e.target.classList && e.target.classList.contains('back')) { close(); return; }
  const el = e.target.closest('[data-act]');
  if (S.acctOpen && !(el && el.dataset.act === 'acctMenu')) { S.acctOpen = false; renderAcct(); }
  if (S.moreOpen && !(el && el.dataset.act === 'moreMenu')) { S.moreOpen = false; renderMore(); }
  if (!el) return;
  if (isViewer() && !VIEWER_ACTS.has(el.dataset.act)) return;
  const f = A[el.dataset.act]; if (f) f(el.dataset);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (!el || (isViewer() && !VIEWER_CHG.has(el.dataset.chg))) return; if (C[el.dataset.chg]) C[el.dataset.chg](el); });
/* champs de formulaire en brouillon : on retient la saisie sans redessiner (pas de perte de focus) */
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && S.sheet) { S.sheet[el.dataset.inp] = el.value; if (S.sheet.err) { S.sheet.err = ''; } } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) { close(); return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.inp && S.sheet && S.sheet.type === 'personForm') {
    e.preventDefault();
    if (e.target.id === 'fName') { const r = $('#fRole'); if (r) r.focus(); } else A.personSave();
  }
});
/* pendant la frappe dans un champ texte d'une fiche ouverte, on ne la redessine jamais toute
   seule (un évènement temps réel en arrière-plan ne doit pas effacer ce qui est en train
   d'être tapé, ni faire sauter le curseur, ni fermer le clavier) : la mise à jour attend que
   le champ perde le focus. Protège Comptes (nom du compte, nom de l'équipe) comme les autres
   fiches, TL, GL et Admin. */
function typingInSheet(){
  const el = document.activeElement, sheet = document.getElementById('sheet');
  return !!(el && sheet && sheet.contains(el) && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'date'))));
}

/* ---------- bouton retour (Android notamment) ----------
   Sans historique, le premier retour quitte directement l'appli : pas pratique sur téléphone,
   tablette ou PC. On garde toujours une entrée « tampon » : un retour referme la fiche
   ouverte (ou revient à l'écran de choix du compte, ou à l'onglet Planning) au lieu de
   fermer l'appli ; il faut fermer tout ce qu'il y a à fermer avant qu'un retour quitte. */
function pushNavState(){ try { history.pushState({app:true}, document.title); } catch (e) {} }
window.addEventListener('popstate', () => {
  if (S.sheet) close();
  else if (S.loginPick) { S.loginPick = null; render(); }
  else if (S.tab !== 'plan') { S.tab = 'plan'; LS.set('tab', 'plan'); render(); window.scrollTo(0, 0); }
  pushNavState();
});
pushNavState();

/* ---------- boot (Supabase : chargement + temps réel) ---------- */
let profileChannel = null, bizChannels = [];
function teardownBiz(){ bizChannels.forEach(ch => { try { sb.removeChannel(ch); } catch (e) {} }); bizChannels = []; }
function subscribeTable(list, table, pk, onUpsert, onDelete){
  const ch = sb.channel('rt:' + table + ':' + Math.random().toString(36).slice(2))
    .on('postgres_changes', {event:'*', schema:'public', table}, payload => {
      if (payload.eventType === 'DELETE') onDelete((payload.old || {})[pk]); else onUpsert(payload.new);
    })
    .subscribe();
  list.push(ch);
  return ch;
}
async function loadProfiles(){
  const {data, error} = await sb.from('profiles').select(S.authUser ? '*' : 'id,name,role,active,login_email');
  if (!error) { const o = {}; (data || []).forEach(r => { o[r.id] = r; }); S.profiles = o; }
  if (!profileChannel) profileChannel = subscribeTable([], 'profiles', 'id', r => { S.profiles[r.id] = r; later(); }, id => { delete S.profiles[id]; later(); });
  later();
}
async function loadBusinessData(){
  const [ppl, pst, nts, cfgRow] = await Promise.all([
    sb.from('people').select('*'),
    sb.from('posts').select('*'),
    sb.from('nights').select('*').order('date', {ascending:false}).limit(400),
    sb.from('config').select('*').eq('key', 'main').maybeSingle()
  ]);
  S.people = {}; (ppl.data || []).forEach(r => { S.people[r.id] = rowToPerson(r); });
  S.posts = {}; (pst.data || []).forEach(r => { S.posts[r.id] = rowToPost(r); });
  S.nights = {}; (nts.data || []).forEach(r => { S.nights[r.date] = rowToNight(r); });
  S.cfg = Object.assign({}, DEFAULT_CFG, (cfgRow.data && cfgRow.data.value) || {});
  S.ready = true;
  teardownBiz();
  subscribeTable(bizChannels, 'people', 'id', r => { S.people[r.id] = rowToPerson(r); later(); }, id => { delete S.people[id]; later(); });
  subscribeTable(bizChannels, 'posts', 'id', r => { S.posts[r.id] = rowToPost(r); later(); }, id => { delete S.posts[id]; later(); });
  subscribeTable(bizChannels, 'nights', 'date', r => { S.nights[r.date] = rowToNight(r); later(); }, date => { delete S.nights[date]; later(); });
  subscribeTable(bizChannels, 'config', 'key', r => { if (r.key === 'main') S.cfg = Object.assign({}, DEFAULT_CFG, r.value || {}); later(); }, () => {});
  /* les suggestions (Admin seulement) ne retardent plus le premier affichage */
  render();
  maybeShowWhatsNew();
  loadFeedback().then(() => { if (isAdmin()) render(); });
}
/* affiche la popup « Quoi de neuf » une seule fois par appareil/compte quand APP_VERSION change */
function maybeShowWhatsNew(){
  if (!profile() || S.sheet) return;
  if (LS.get('whatsnew_seen', '') === APP_VERSION) return;
  LS.set('whatsnew_seen', APP_VERSION);
  open({type:'whatsnew'});
}
/* bandeau « Nouvelle version disponible » : détecte qu'une mise à jour a été publiée pendant que
   l'appli reste ouverte (téléphone qu'on ne ferme jamais), sans attendre une réinstallation.
   On recharge en direct la page publiée (jamais mise en cache, voir sw.js) et on compare son
   APP_VERSION à celle déjà chargée en mémoire ici. */
let updCheckBusy = false, updFound = false;
async function checkForUpdate(){
  if (updFound || updCheckBusy || document.visibilityState === 'hidden') return;
  updCheckBusy = true;
  try {
    const rep = await fetch('./', {cache: 'no-store'});
    const texte = await rep.text();
    const m = texte.match(/APP_VERSION\s*=\s*'([^']+)'/);
    if (m && m[1] && m[1] !== APP_VERSION) {
      updFound = true;
      $('#updbar').hidden = false;
    }
  } catch (e) { /* hors-ligne : on retentera au prochain déclenchement */ }
  updCheckBusy = false;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
window.addEventListener('focus', checkForUpdate);
setInterval(checkForUpdate, 20 * 60000);
/* suggestions des TL/GL : chargées et suivies en temps réel uniquement pour l'Admin */
async function loadFeedback(){
  S.feedback = {};
  if (!isAdmin()) { updateTitle(); return; }
  const {data} = await sb.from('feedback').select('*').order('created_at', {ascending:false}).limit(300);
  (data || []).forEach(r => { S.feedback[r.id] = r; });
  subscribeTable(bizChannels, 'feedback', 'id', r => {
    const isNew = !S.feedback[r.id];
    S.feedback[r.id] = r;
    if (isNew && !r.read) notifyFeedback(r);
    later(); updateTitle();
  }, id => { delete S.feedback[id]; later(); updateTitle(); });
  updateTitle();
  /* demande l'autorisation des notifications système une seule fois, à la connexion Admin */
  try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
}
const BASE_TITLE = document.title;
function updateTitle(){ const n = isAdmin() ? unreadFeedback() : 0; document.title = (n ? '(' + n + ') ' : '') + BASE_TITLE; }
function notifyFeedback(r){
  const txt = String(r.message || '');
  toast('💬 Nouvelle suggestion de ' + (r.author_name || '?') + ' : ' + (txt.length > 80 ? txt.slice(0, 80) + '…' : txt));
  if (navigator.vibrate) try { navigator.vibrate([20, 60, 20]); } catch (e) {}
  try {
    if (window.Notification && Notification.permission === 'granted' && document.hidden) {
      const nt = new Notification('Suggestion de ' + (r.author_name || '?'), {body:txt.slice(0, 200), tag:'fb-' + r.id});
      nt.onclick = () => { window.focus(); A.messages(); nt.close(); };
    }
  } catch (e) {}
}
async function boot(){
  /* la session est lue en local (rapide) ; profils et données partent ensuite ensemble */
  const {data:{session}} = await sb.auth.getSession();
  S.authUser = session ? session.user : null;
  S.authReady = true;
  if (S.authUser) { await Promise.all([loadProfiles(), loadBusinessData()]); maybeShowWhatsNew(); }
  else { await loadProfiles(); render(); }
  /* pas d'appel Supabase attendu (await) DANS ce rappel : supabase-js garde son verrou de
     session pendant le rappel, et les requêtes lancées dedans attendaient ce verrou → long
     « Chargement… » après la saisie du mot de passe. On les lance juste après (setTimeout).
     Les profils sont rechargés aussi : connecté, on voit des lignes (la sienne pour l'Admin)
     que la liste lue avant connexion ne contenait pas. */
  sb.auth.onAuthStateChange((event, session) => {
    const newUser = session ? session.user : null;
    const changed = (newUser && newUser.id) !== (S.authUser && S.authUser.id);
    S.authUser = newUser; S.authReady = true;
    if (newUser) { S._forcedOut = false; if (changed) { setTimeout(() => { loadProfiles(); loadBusinessData(); }, 0); setTimeout(() => { if (S.authUser && !S.ready) toast('Connexion lente… Si rien ne bouge, ferme complètement l’appli et rouvre-la.'); }, 12000); } else render(); }
    else { teardownBiz(); S.people = {}; S.posts = {}; S.nights = {}; S.feedback = {}; updateTitle(); S.ready = false; S._forcedOut = false; render(); }
  });
  /* tient à jour l'écran « fermé hors horaires » et le bonjour/bonsoir sans recharger */
  setInterval(() => { if (S.authUser && profile()) render(); }, 60000);
}
render();
boot();
})();
</script>
